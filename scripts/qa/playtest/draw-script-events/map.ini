AudioEvent DrawEventProbeSound
    Sounds = WAWater_cre1L2a
    MinRange = 300
    MaxRange = 700
    Type = world everyone
End
ChildObject DrawEntryProbe GoblinCaveTroll
    ReplaceModule ModuleTag_01
        Draw = W3DScriptedModelDraw ModuleTag_DrawEntry
            DefaultModelConditionState
                Model = MuCavTroll_SKN
            End
            IdleAnimationState
                Animation
                    AnimationName = MuCavTroll_SKL.MuCavTroll_IDLA
                    AnimationMode = LOOP
                End
                LuaEvent = OnStateEnter Data: show_rock
            End
            AnimationState = RAISING_FLAG
                Animation
                    AnimationName = MuCavTroll_SKL.MuCavTroll_IDLA
                    AnimationMode = LOOP
                End
                BeginScript
                    CurDrawableHideSubObjectPermanently("ROCK")
                    CurDrawablePlaySound("DrawEventProbeSound")
                EndScript
            End
        End
    End
End
