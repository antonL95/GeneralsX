AudioEvent DrawBindingProbeSound
    Sounds = WAWater_cre1L2a
    MinRange = 300
    MaxRange = 700
    Type = world everyone
End
ChildObject DrawBindingProbe GondorEarnur
    ReplaceModule ModuleTag_DRAW
        Draw = W3DScriptedModelDraw ModuleTag_DrawBindings
            DefaultModelConditionState
                Model = guanoriens_skn
                Skeleton = guNmaarms_skl
            End
            IdleAnimationState
                Animation
                    AnimationName = GUNSOLDR_IDLB
                    AnimationMode = LOOP
                End
                BeginScript
                    CurDrawableShowModule("ModuleTag_DrawBindingMarker")
                EndScript
            End
            AnimationState = RAISING_FLAG
                Animation
                    AnimationName = GUNSOLDR_IDLB
                    AnimationMode = LOOP
                End
                BeginScript
                    CurDrawableHideModule("ModuleTag_DrawBindingMarker")
                    CurDrawablePlaySound("DrawBindingProbeSound")
                EndScript
            End
            AnimationState = FIRING_OR_PREATTACK_A
                Animation = Fallback
                    AnimationName = GUNSOLDR_ATKA
                    AnimationMode = LOOP
                End
                Animation = Bearing
                    AnimationName = GUNSOLDR_ATKB
                    AnimationMode = LOOP
                End
                BeginScript
                    angle = CurDrawableGetCurrentTargetBearing()
                    if angle >= -3.14160 and angle <= 3.14160 then return "Bearing" end
                    return "Fallback"
                EndScript
            End
        End
    End
    AddModule
        Draw = W3DScriptedModelDraw ModuleTag_DrawBindingMarker
            DefaultModelConditionState
                Model = GBCASTWallBF
            End
        End
    End
End
