FXList FX_TestParticleFields
  ParticleSystem
    Name = TestParticleControl
  End
  ParticleSystem
    Name = TestParticleTurbulence
  End
End

FXParticleSystem TestParticleControl
  System
    Priority = ALWAYS_RENDER
    IsOneShot = Yes
    Shader = ALPHA
    Type = PARTICLE
    ParticleName = EXCloud01.tga
    Lifetime = 100 100
    Size = 5 5
    BurstCount = 1 1
  End
  Color = DefaultColor
    Color1 = R:255 G:255 B:255 0
  End
  Alpha = DefaultAlpha
    Alpha1 = 1 1 0
  End
  Physics = DefaultPhysics
    VelocityDamping = 1 1
  End
  EmissionVolume = PointEmissionVolume
  End
  Draw = DefaultDraw
  End
  Wind = DefaultWind
    WindMotion = Circular
    WindStrength = 0
  End
End

