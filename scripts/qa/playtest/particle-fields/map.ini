End

FXParticleSystem TestParticleRotationX
  System
    Priority = ALWAYS_RENDER
    Shader = W3D_ALPHA
    Type = DRAWABLE
    ParticleName = EXGrass02.w3d
    Lifetime = 100 100
    Size = 1 1
    BurstCount = 1 1
    BurstDelay = 100 100
  End
  Alpha = DefaultAlpha
    Alpha1 = 1 1 0
  End
  Update = DefaultUpdate
    AngleZ = 0.2 0.2
    AngularRateZ = 0.1 0.1
    AngularDamping = 1 1
    AngleXY = 0.3 0.3
    AngularRateXY = 0.05 0.05
    AngularDampingXY = 1 1
    Rotation = ROTATE_X
  End
  Physics = DefaultPhysics
    VelocityDamping = 1 1
  End
  Draw = RenderObjectDraw
  End
End

