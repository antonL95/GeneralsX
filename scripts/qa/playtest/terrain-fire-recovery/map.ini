Weapon TerrainFireRecoveryIgnition
    FireLogicNugget
        LogicType = INCREASE_BURN_RATE
        Radius = 1
        Damage = 200
    End
End

ChildObject TerrainFireRecoveryLauncher GondorFighter
    RemoveModule ModuleTag_03
    AddModule
        Behavior = FireWeaponUpdate TerrainFireRecoveryUpdate
            FireWeaponNugget
                WeaponName = TerrainFireRecoveryIgnition
                FireDelay = 0
                OneShot = Yes
                Offset = X:90 Y:0 Z:0
            End
        End
    End
End

ChildObject TerrainFireRecoveryObserver GondorFighter
    KindOf = SELECTABLE INFANTRY IMMOBILE
    RemoveModule ModuleTag_03
End
