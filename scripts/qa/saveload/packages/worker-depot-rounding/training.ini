ModifierList WorkerDepotRoundingProduction
    Category = SPELL
    Modifier = PRODUCTION 122%
    Duration = 0
End

ChildObject WorkerDepotRoundingFixture MordorLumberMill
    IsTrainable = Yes
    ReplaceModule ModuleTag_FreeWorker
        Behavior = SpawnBehavior WorkerDepotRoundingSpawns
            SpawnNumber = 1
            SpawnTemplateName = WorkerDepotRoundingWorker
            OneShot = Yes
            RespectCommandLimit = No
        End
    End
End

ChildObject WorkerDepotRoundingWorker MordorWorker
    ReplaceModule ModuleTag_10
        Behavior = WorkerAIUpdate WorkerDepotRoundingHarvest
            MaxBoxes = 1
            HarvestTrees = Yes
            SupplyWarehouseScanDistance = 90
            SupplyCenterActionDelay = 1000
            HarvestActivationRange = 75
            HarvestPreparationTime = 150
            HarvestActionTime = 150
        End
    End
End

Object WorkerDepotRoundingTree
    KindOf = TREE
    IsHarvestable = Yes
    SupplyOverride = 1
End
