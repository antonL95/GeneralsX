ChildObject Pkg68ProtectedRecruit MordorFighter1
	BuildTime = 1
	BuildCost = 1
End

CommandButton Pkg68RecruitButton
	Command = UNIT_BUILD
	Object = Pkg68ProtectedRecruit
End

CommandSet Pkg68ProtectedPitCommands
	1 = Pkg68RecruitButton
End

ChildObject Pkg68ProtectedPit MordorOrcPit
	CommandSet = Pkg68ProtectedPitCommands
	ReplaceModule ProductionUpdateModuleTag
		Behavior = ProductionUpdate Pkg68Protection
			NumDoorAnimations = 1
			DoorOpeningTime = 0
			DoorWaitOpenTime = 3000
			DoorCloseTime = 0
			ConstructionCompleteDuration = 0
			UnitInvulnerableTime = 6000
			BonusForType = MordorFighterHorde
			SpeedBonusAudioLoop = CallTheHordeOrcPitLoop
			GiveNoXP = Yes
		End
	End
End

ChildObject Pkg68DisabledRecruit Pkg68ProtectedRecruit
End

CommandButton Pkg68DisabledRecruitButton
	Command = UNIT_BUILD
	Object = Pkg68DisabledRecruit
End

CommandSet Pkg68DisabledPitCommands
	1 = Pkg68DisabledRecruitButton
End

ChildObject Pkg68DisabledPit Pkg68ProtectedPit
	CommandSet = Pkg68DisabledPitCommands
End

Object Pkg68Fortress
	KindOf = STRUCTURE IMMOBILE COMMANDCENTER IGNORE_FOR_VICTORY
	RemoveModule ModuleTag_DefaultInactiveBody
	AddModule
		Body = ActiveBody Pkg68FortressBody
			MaxHealth = 1000
		End
	End
End
