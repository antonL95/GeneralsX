Object P69GrondReverse
	KindOf = MACHINE SELECTABLE NO_COLLIDE IGNORE_FOR_VICTORY
	CommandPoints = 0
	VisionRange = 0
	ShroudClearingRange = 0
	Geometry = CYLINDER
	GeometryMajorRadius = 10
	GeometryHeight = 10
	RemoveModule ModuleTag_DefaultInactiveBody
	AddModule
		Body = ActiveBody P69GrondBody
			MaxHealth = 1000
		End
		Behavior = AIUpdateInterface P69GrondAI
			AutoAcquireEnemiesWhenIdle = No
		End
		Behavior = PhysicsBehavior P69GrondPhysics
			Mass = 1
		End
		Behavior = SiegeEngineContain P69GrondContain
			ObjectStatusOfCrew = UNSELECTABLE UNATTACKABLE
			Slots = 0
			PassengerFilter = NONE
			AllowAlliesInside = No
			AllowEnemiesInside = No
			AllowNeutralInside = No
			CrewFilter = NONE +MONSTER
			CrewMax = 6
			SpeedPercentPerCrew = 50%
			InitialCrew = P69GrondCrewMember 6
		End
	End
	LocomotorSet
		Locomotor = P69GrondLocomotor
		Condition = SET_NORMAL
		Speed = 10
	End
End

