Object TeamScriptOpsFixtureUnit
    KindOf = INFANTRY IGNORE_FOR_VICTORY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody TeamScriptOpsFixtureBody
            MaxHealth = 10
            InitialHealth = 10
        End
        Behavior = AIUpdateInterface TeamScriptOpsFixtureAI
        End
        Behavior = EmotionTrackerUpdate TeamScriptOpsFixtureTracker
            AddEmotion = Terror_Base
        End
    End
    LocomotorSet
        Locomotor = HumanLocomotor
        Condition = SET_NORMAL
        Speed = 20
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 3
    GeometryHeight = 6
End

Object TeamScriptOpsFixtureTarget
    KindOf = STRUCTURE IMMOBILE IGNORE_FOR_VICTORY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody TeamScriptOpsFixtureTargetBody
            MaxHealth = 10
            InitialHealth = 10
        End
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 3
    GeometryHeight = 6
End

NewEvaEvent TeamScriptOpsFixtureWin
    Priority = 300
    ExpirationTimeMS = 5000
    CountAsJumpToLocation = No
End

NewEvaEvent TeamScriptOpsFixtureLoss
    Priority = 300
    ExpirationTimeMS = 5000
    CountAsJumpToLocation = No
End

ScoredKillEvaAnnouncer TeamScriptOpsFixtureWin
    EvaEvent = TeamScriptOpsFixtureWin
    CountOnlyKillsByLocalPlayer = Yes
    MinimumCountForAnnouncement = 2
    MaximumTimeForAnnouncementMS = 1000
    ObjectFilter = ANY +TeamScriptOpsFixtureTarget
End

ScoredKillEvaAnnouncer TeamScriptOpsFixtureLoss
    EvaEvent = TeamScriptOpsFixtureLoss
    CountOnlyKillsAgainstLocalPlayer = Yes
    MinimumCountForAnnouncement = 2
    MaximumTimeForAnnouncementMS = 1000
    ObjectFilter = ANY +TeamScriptOpsFixtureTarget
End
