SpecialPower ReqFilterPower
	Enum = SPECIAL_SPELL_BOOK_PALANTIR_VISION
	ReloadTime = 4000
End

CommandButton ReqFilterButton
	Command = SPELL_BOOK
	SpecialPower = ReqFilterPower
	Options = NEED_TARGET_POS
End

CommandSet ReqFilterCommandSet
	1 = ReqFilterButton
End

Object ReqFilterMarker
	KindOf = IMMOBILE NO_COLLIDE IGNORE_FOR_VICTORY
	RemoveModule ModuleTag_DefaultInactiveBody
	AddModule
		Body = ActiveBody ReqFilterMarkerBody
			MaxHealth = 100
		End
	End
End

ObjectCreationList ReqFilterOCL
	CreateObject
		ObjectNames = ReqFilterMarker
		Count = 1
		Disposition = LIKE_EXISTING
	End
End

Object ReqFilterFortress
	KindOf = STRUCTURE IMMOBILE COMMANDCENTER IGNORE_FOR_VICTORY
	RemoveModule ModuleTag_DefaultInactiveBody
	AddModule
		Body = ActiveBody ReqFilterFortressBody
			MaxHealth = 1000
		End
	End
End

ChildObject ReqFilterBook ReqFilterMarker
	KindOf = SPELL_BOOK IMMOBILE IGNORES_SELECT_ALL
	CommandSet = ReqFilterCommandSet
	AddModule
		Behavior = OCLSpecialPower ReqFilterPowerModule
			SpecialPowerTemplate = ReqFilterPower
			OCL = ReqFilterOCL
			CreateLocation = CREATE_AT_LOCATION
			AvailableAtStart = Yes
			RequirementsFilterMPSkirmish = SPELL_BOOK_REQUIREMENTS_FILTER
			RequirementsFilterStrategic = SPELL_BOOK_REQUIREMENTS_FILTER_STRATEGIC
		End
	End
End
