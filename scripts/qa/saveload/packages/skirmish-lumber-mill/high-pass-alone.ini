SkirmishAIData TheSkirmishAIData
    DisableUnitBuilding = Yes
    DifficultyTuning BrutalTuning
        Difficulty = BRUTAL
        SpecialPowerActivationProbability = 0 : 1
        EconomyMaxFarms = 0
    End
End

ArmyDefinition MordorArmy
    TacticalAITargets = TARGETLESS
    MaxTeamsPerTarget = 1
End

CommandSet SkirmishMillPorterCommands
    1 = Command_PorterConstructMordorLumberMill_ForAI
End

ChildObject SkirmishMillPorter MordorPorter
    CommandSet = SkirmishMillPorterCommands
    RemoveModule ModueTag_MordorPorterCommandSetForEasyNormalAI
    RemoveModule ModueTag_MordorPorterCommandSetForHardBrutalAI
    RemoveModule ModueTag_MordorPorterCommandSetAI_WotR
End

ChildObject SkirmishMillFarm MordorSlaughterHouse
End
