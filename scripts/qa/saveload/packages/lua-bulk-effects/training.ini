ChildObject LuaBulkTowerRecipient ElvenLorienArcher_TDMode
End

Object LuaBulkFearRecipient
    KindOf = INFANTRY IMMOBILE IGNORE_FOR_VICTORY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody LuaBulkFearBody
            MaxHealth = 1000
            InitialHealth = 1000
        End
        Behavior = AIUpdateInterface LuaBulkFearAI
            AILuaEventsList = InfantryFunctions
            AutoAcquireEnemiesWhenIdle = No
        End
        Behavior = EmotionTrackerUpdate LuaBulkFearTracker
            AddEmotion = UncontrollableFear_Base
        End
    End
End

ChildObject LuaBulkForcedRegistration LuaBulkFearRecipient
    RemoveModule LuaBulkFearAI
    ForceLuaRegistration = Yes
End
