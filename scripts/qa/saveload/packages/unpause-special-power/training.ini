Upgrade UnpauseSpImmediateTrigger
	Type = OBJECT
End

Upgrade UnpauseSpObeyTrigger
	Type = OBJECT
End

SpecialPower UnpauseSpImmediatePower
	Enum = SPECIAL_SPELL_BOOK_HEAL
	ReloadTime = 4000
End

SpecialPower UnpauseSpObeyPower
	Enum = SPECIAL_SPELL_BOOK_ELVEN_GIFTS
	ReloadTime = 4000
End

CommandButton UnpauseSpImmediateButton
	Command = SPECIAL_POWER
	SpecialPower = UnpauseSpImmediatePower
	Options = NEED_TARGET_POS
End

CommandButton UnpauseSpObeyButton
	Command = SPECIAL_POWER
	SpecialPower = UnpauseSpObeyPower
	Options = NEED_TARGET_POS
End

CommandSet UnpauseSpCommandSet
	1 = UnpauseSpImmediateButton
	2 = UnpauseSpObeyButton
End

ChildObject UnpauseSpMarker GondorFighter
End

ObjectCreationList UnpauseSpOCL
	CreateObject
		ObjectNames = UnpauseSpMarker
		Count = 1
		Disposition = LIKE_EXISTING
	End
End

Object UnpauseSpCaster
	KindOf = STRUCTURE IMMOBILE IGNORE_FOR_VICTORY
	CommandSet = UnpauseSpCommandSet
	RemoveModule ModuleTag_DefaultInactiveBody
	AddModule
		Body = ActiveBody UnpauseSpCasterBody
			MaxHealth = 1000
		End
		Behavior = OCLSpecialPower UnpauseSpImmediateModule
			SpecialPowerTemplate = UnpauseSpImmediatePower
			OCL = UnpauseSpOCL
			CreateLocation = CREATE_AT_LOCATION
			AvailableAtStart = No
			StartsPaused = Yes
		End
		Behavior = UnpauseSpecialPowerUpgrade UnpauseSpImmediateUpgrade
			SpecialPowerTemplate = UnpauseSpImmediatePower
			TriggeredBy = UnpauseSpImmediateTrigger
			ObeyRechageOnTrigger = No
		End
		Behavior = OCLSpecialPower UnpauseSpObeyModule
			SpecialPowerTemplate = UnpauseSpObeyPower
			OCL = UnpauseSpOCL
			CreateLocation = CREATE_AT_LOCATION
			AvailableAtStart = No
			StartsPaused = Yes
		End
		Behavior = UnpauseSpecialPowerUpgrade UnpauseSpObeyUpgrade
			SpecialPowerTemplate = UnpauseSpObeyPower
			TriggeredBy = UnpauseSpObeyTrigger
			ObeyRechageOnTrigger = Yes
		End
	End
End
