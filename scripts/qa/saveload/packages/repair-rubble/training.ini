Object RrBookendWall
	Draw = W3DScriptedModelDraw ModuleTag_Draw
		DefaultModelConditionState
			Model = None
		End
	End
	KindOf = PRELOAD STRUCTURE IMMOBILE SELECTABLE WALK_ON_TOP_OF_WALL DEFENSIVE_WALL
	KeepSelectableWhenDead = Yes
	Geometry = BOX
	GeometryName = WallBody
	GeometryMajorRadius = 40.0
	GeometryMinorRadius = 15.0
	GeometryHeight = 40.0
	GeometryIsSmall = No
	AdditionalGeometry = BOX
	GeometryName = Bookend
	GeometryMajorRadius = 10.0
	GeometryMinorRadius = 15.0
	GeometryHeight = 40.0
	GeometryOffset = X:35.0 Y:0.0 Z:0.0
	RemoveModule ModuleTag_DefaultInactiveBody
	RemoveModule ModuleTag_DefaultDestroyDie
	AddModule
		Body = ActiveBody ModuleTag_Body
			MaxHealth = 200
		End
	End
End

