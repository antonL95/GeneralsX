SpecialPower AutoAbilitiesFastShield
	Enum = SPECIAL_SHIELD_BUBBLE
	ReloadTime = 5000
End

Object AutoAbilitiesFastCaster
	KindOf = HERO INFANTRY IMMOBILE NO_COLLIDE
	RemoveModule ModuleTag_DefaultInactiveBody
	AddModule
		Body = ActiveBody AutoAbilitiesFastBody
			MaxHealth = 1000
		End
	End
	AddModule
		Behavior = AIUpdateInterface AutoAbilitiesFastAI
			AILuaEventsList = GandalfFunctions
			AutoAcquireEnemiesWhenIdle = No
		End
	End
	AddModule
		Behavior = SpecialPowerModule AutoAbilitiesFastStarter
			SpecialPowerTemplate = AutoAbilitiesFastShield
			SetModelCondition = ModelConditionState:USER_3
			SetModelConditionTime = 1
		End
	End
	AddModule
		Behavior = SlowDeathBehavior AutoAbilitiesFastDeath
			DeathTypes = ALL
			DestructionDelay = 1000
		End
	End
End

Object AutoAbilitiesAttacker
	KindOf = IMMOBILE NO_COLLIDE UNATTACKABLE
	RemoveModule ModuleTag_DefaultInactiveBody
	AddModule
		Body = ActiveBody AutoAbilitiesAttackerBody
			MaxHealth = 100
		End
	End
End
