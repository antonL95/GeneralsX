AIDozerAssignment MapScriptDozerOverride
    Side = mordor
    Unit = MapScriptDozerReplacement
End

CommandButton MapScriptDozerTrainDefault
    Command = UNIT_BUILD
    Object = MordorPorter
End

CommandButton MapScriptDozerTrainAssigned
    Command = UNIT_BUILD
    Object = MapScriptDozerReplacement
End

CommandSet MapScriptDozerFactoryCommands
    1 = MapScriptDozerTrainDefault
    2 = MapScriptDozerTrainAssigned
End

ChildObject MapScriptDozerReplacement MordorPorter
    BuildCost = 0
    BuildTime = 1
End

Object MapScriptDozerFactory
    Side = Mordor
    KindOf = STRUCTURE IMMOBILE SELECTABLE DOZER_FACTORY IGNORE_FOR_VICTORY
    CommandSet = MapScriptDozerFactoryCommands
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody MapScriptDozerFactoryBody
            MaxHealth = 1000
            InitialHealth = 1000
        End
        Behavior = ProductionUpdate MapScriptDozerFactoryProduction
            MaxQueueEntries = 1
        End
        Behavior = QueueProductionExitUpdate MapScriptDozerFactoryExit
            UnitCreatePoint = X:12.0 Y:0.0 Z:0.0
            NaturalRallyPoint = X:22.0 Y:0.0 Z:0.0
        End
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 10
    GeometryHeight = 10
End
