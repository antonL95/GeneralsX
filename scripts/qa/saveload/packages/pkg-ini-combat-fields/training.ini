Armor CombatFieldsArmor
    DamageScalar = 75%
    Armor = DEFAULT 80%
End

Weapon CombatFieldsSlash
    AttackRange = 120
    RadiusDamageAffects = ENEMIES NEUTRALS
    DamageNugget
        Damage = 20
        DamageType = SLASH
    End
End

Weapon CombatFieldsUnresistable
    AttackRange = 120
    RadiusDamageAffects = ENEMIES NEUTRALS
    DamageNugget
        Damage = 20
        DamageType = UNRESISTABLE
    End
End

Weapon CombatFieldsContained
    AttackRange = 120
    RadiusDamageAffects = ENEMIES NEUTRALS
    DamageContainedNugget
        KillCount = 1
        KillKindof = NONE +CombatFieldsPassenger
        DeathType = SUICIDED
    End
End

CommandButton CombatFieldsToggle
    Command = TOGGLE_WEAPON
    WeaponSlotToggle1 = PRIMARY
    WeaponSlotToggle2 = TERTIARY
    Options = TOGGLE_IMAGE_ON_WEAPON
    ButtonImage = UCCatapult_Heads UCCatapult_Rock
    ButtonBorderType = ACTION
    InPalantir = Yes
End

CommandSet CombatFieldsCommandSet
    1 = CombatFieldsToggle
End

Object CombatFieldsTarget
    KindOf = SELECTABLE IMMOBILE INFANTRY
    ArmorSet
        Conditions = None
        Armor = CombatFieldsArmor
    End
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody CombatFieldsBody
            MaxHealth = 100
        End
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 3
    GeometryMinorRadius = 3
    GeometryHeight = 10
    GeometryIsSmall = Yes
End

ChildObject CombatFieldsPassenger CombatFieldsTarget
End

ChildObject CombatFieldsOtherPassenger CombatFieldsTarget
End

ChildObject CombatFieldsCarrier CombatFieldsTarget
    AddModule
        Behavior = TransportContain CombatFieldsContain
            Slots = 3
            PassengerFilter = NONE +CombatFieldsPassenger +CombatFieldsOtherPassenger
        End
    End
End

ChildObject CombatFieldsShooter GondorFighter
    CommandSet = CombatFieldsCommandSet
    WeaponSet
        Conditions = None
        Weapon = PRIMARY CombatFieldsSlash
        Weapon = TERTIARY CombatFieldsUnresistable
        AutoChooseSources = TERTIARY NONE
    End
End
