PlayerTemplate FactionMen
    SpellBook = IsengardSpellBook
    SpellBookMp = IsengardSpellBook
End

ChildObject WeatherNuggetProbe GondorFighter
	KindOf = INFANTRY UNATTACKABLE IGNORE_FOR_VICTORY
	RemoveModule ModuleTag_03
	ReplaceModule ModuleTag_02
		Body = ActiveBody ModuleTag_ProbeBody
			MaxHealth = 100
			InitialHealth = 100
		End
	End
End

Weapon WeatherNuggetIgnition
    FireLogicNugget
        LogicType = INCREASE_FUEL
        Radius = 24
        Damage = 70
        MinMaxBurnRate = 20
        MinDecay = 1
        MaxResistance = 5
    End
    FireLogicNugget
        LogicType = INCREASE_BURN_RATE
        Radius = 1
        Damage = 20
    End
End

Object WeatherNuggetIgnition
    KindOf = NO_COLLIDE IMMOBILE INERT IGNORE_FOR_VICTORY
    AddModule
        Body = ImmortalBody ModuleTag_Body
            MaxHealth = 1
            InitialHealth = 1
        End
    End
    AddModule
        Behavior = FireWeaponUpdate ModuleTag_Ignition
            FireWeaponNugget
                WeaponName = WeatherNuggetIgnition
                FireDelay = 0
                OneShot = Yes
                Offset = X:90 Y:0 Z:0
            End
        End
    End
End
