Upgrade ScriptPlayerSumUpgrade
    Type = OBJECT
End

Object ScriptPlayerSumUnit
    KindOf = INFANTRY IMMOBILE UNATTACKABLE IGNORE_FOR_VICTORY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody ScriptPlayerSumUnitBody
            MaxHealth = 10
            InitialHealth = 10
        End
    End
End

