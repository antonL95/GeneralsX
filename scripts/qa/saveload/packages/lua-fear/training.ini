ModifierList LuaFearImmunity
    Category = LEADERSHIP
    Modifier = RESIST_FEAR 100%
    Duration = 2000
End

Object LuaFearCower
    KindOf = INFANTRY SELECTABLE IGNORE_FOR_VICTORY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody LuaFearBody
            MaxHealth = 1000
            InitialHealth = 1000
        End
        Behavior = PhysicsBehavior LuaFearPhysics
            Mass = 1
        End
        Behavior = AIUpdateInterface LuaFearAI
            AutoAcquireEnemiesWhenIdle = No
            AILuaEventsList = GondorFighterFunctions
        End
        Behavior = EmotionTrackerUpdate LuaFearTracker
            AddEmotion = OVERRIDE FearIdle_Base
                Duration = 1000
                AILockDuration = 400
            End
        End
    End
    LocomotorSet
        Locomotor = HumanLocomotor
        Condition = SET_NORMAL
        Speed = 45
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 3
    GeometryHeight = 6
End

ChildObject LuaFearSource LuaFearCower
    KindOf = IMMOBILE IGNORE_FOR_VICTORY
    RemoveModule LuaFearAI
    RemoveModule LuaFearTracker
End

ChildObject LuaFearPanic LuaFearCower
    ReplaceModule LuaFearTracker
        Behavior = EmotionTrackerUpdate LuaFearPanicTracker
            AddEmotion = Terror_Base
        End
    End
End

ChildObject LuaFearUncontrolled LuaFearCower
    ReplaceModule LuaFearAI
        Behavior = AIUpdateInterface LuaFearUncontrolledAI
            AutoAcquireEnemiesWhenIdle = No
            AILuaEventsList = MordorFighterFunctions
        End
    End
    ReplaceModule LuaFearTracker
        Behavior = EmotionTrackerUpdate LuaFearUncontrolledTracker
            AddEmotion = UncontrollableFear_Base
        End
    End
End

ChildObject LuaFearUncontrolledBacks LuaFearUncontrolled
    ReplaceModule LuaFearUncontrolledTracker
        Behavior = EmotionTrackerUpdate LuaFearUncontrolledBacksTracker
            AddEmotion = UncontrollableFear_Base_Evil
        End
    End
End

Locomotor LuaFearBackingLocomotor
    Surfaces = GROUND
    TurnTime = 1000
    Acceleration = 200
    Braking = 200
    Appearance = TWO_LEGS
    BackingUpSpeed = 25%
End

Object LuaFearHordeMember
    KindOf = INFANTRY SELECTABLE NO_COLLIDE IGNORE_FOR_VICTORY
    VisionRange = 0
    ShroudClearingRange = 0
    Geometry = CYLINDER
    GeometryMajorRadius = 3
    GeometryHeight = 4
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody LuaFearMemberBody
            MaxHealth = 100
        End
        Behavior = AIUpdateInterface LuaFearMemberAI
            AutoAcquireEnemiesWhenIdle = No
            AILuaEventsList = GondorFighterFunctions
        End
        Behavior = PhysicsBehavior LuaFearMemberPhysics
            Mass = 1
        End
    End
    LocomotorSet
        Locomotor = LuaFearBackingLocomotor
        Condition = SET_NORMAL
        Speed = 60
    End
End

Object LuaFearHorde
    KindOf = INFANTRY HORDE SELECTABLE NO_COLLIDE IGNORE_FOR_VICTORY
    VisionRange = 0
    ShroudClearingRange = 0
    Geometry = CYLINDER
    GeometryMajorRadius = 3
    GeometryHeight = 4
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody LuaFearHordeBody
            MaxHealth = 100
        End
        Behavior = HordeAIUpdate LuaFearHordeAI
            AutoAcquireEnemiesWhenIdle = No
        End
        Behavior = PhysicsBehavior LuaFearHordePhysics
            Mass = 1
        End
        Behavior = HordeContain LuaFearFormation
            Slots = 1
            InitialPayload = LuaFearHordeMember 1
            PassengerFilter = NONE +INFANTRY
            RankInfo = RankNumber:1 UnitType:LuaFearHordeMember Position:X:10 Y:0
            BackUpMinDistance = 4
            BackUpMaxDistance = 4
            BackupPercentage = 100%
        End
        Behavior = EmotionTrackerUpdate LuaFearHordeTracker
            AddEmotion = OVERRIDE FearIdle_Base
                Duration = 1000
                AILockDuration = 400
            End
        End
    End
    LocomotorSet
        Locomotor = LuaFearBackingLocomotor
        Condition = SET_NORMAL
        Speed = 60
    End
End
