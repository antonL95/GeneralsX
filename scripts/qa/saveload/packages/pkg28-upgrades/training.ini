Upgrade Pkg28Enable
	Type = OBJECT
End

Upgrade Pkg28Obsolete
	Type = OBJECT
End

Upgrade Pkg28Deploy
	Type = OBJECT
End

Upgrade Pkg28Preowned
	Type = PLAYER
End

Object Pkg28Payload
	KindOf = IMMOBILE NOT_AUTOACQUIRABLE
	VisionRange = 0
	ShroudClearingRange = 0
	RemoveModule ModuleTag_DefaultInactiveBody
	RemoveModule ModuleTag_DefaultDestroyDie
	AddModule
		Body = ActiveBody Pkg28Health
			MaxHealth = 100
		End
		Behavior = SlowDeathBehavior Pkg28Death
			DeathTypes = ALL
			DestructionDelay = 1000
		End
	End
	Geometry = CYLINDER
	GeometryMajorRadius = 3
	GeometryHeight = 5
	GeometryIsSmall = Yes
End

Object Pkg28Tower
	BuildCost = 0
	KindOf = STRUCTURE IMMOBILE SELECTABLE NOT_AUTOACQUIRABLE
	VisionRange = 0
	ShroudClearingRange = 0
	RemoveModule ModuleTag_DefaultInactiveBody
	AddModule
		Body = ActiveBody Pkg28Health
			MaxHealth = 100
		End
		Behavior = ObjectCreationUpgrade Pkg28Activation
			TriggeredBy = Pkg28Enable
			Delay = 400
			GrantUpgrade = Pkg28Deploy
			RemoveUpgrade = Pkg28Obsolete
			DestroyWhenSold = Yes
			DeathAnimAndDuration = AnimState:DEATH_2 AnimTime:400
		End
		Behavior = ObjectCreationUpgrade Pkg28Placement
			TriggeredBy = Pkg28Deploy
			ThingToSpawn = Pkg28Payload
			Offset = X:20 Y:0 Z:0
			Angle = 90
			FadeInTime = 600
		End
		Behavior = SlaveWatcherBehavior Pkg28Watcher
			RemoveUpgrade = Pkg28Deploy
		End
	End
	Geometry = CYLINDER
	GeometryMajorRadius = 8
	GeometryHeight = 15
	GeometryIsSmall = No
End

ChildObject Pkg28SavedTower Pkg28Tower
End

Object Pkg28Control
	BuildCost = 0
	KindOf = STRUCTURE IMMOBILE SELECTABLE NOT_AUTOACQUIRABLE
	VisionRange = 0
	ShroudClearingRange = 0
	RemoveModule ModuleTag_DefaultInactiveBody
	AddModule
		Body = ActiveBody Pkg28Health
			MaxHealth = 100
		End
		Behavior = ObjectCreationUpgrade Pkg28Placement
			TriggeredBy = Pkg28Preowned
			ThingToSpawn = Pkg28Payload
		End
		Behavior = ObjectCreationUpgrade Pkg28RemoveOnly
			TriggeredBy = Pkg28Enable
			RemoveUpgrade = Pkg28Obsolete
		End
	End
	Geometry = CYLINDER
	GeometryMajorRadius = 5
	GeometryHeight = 5
	GeometryIsSmall = Yes
End

ChildObject Pkg28ShortFade Pkg28Control
	ReplaceModule Pkg28Placement
		Behavior = ObjectCreationUpgrade Pkg28FastPlacement
			TriggeredBy = Pkg28Preowned
			ThingToSpawn = Pkg28Payload
			FadeInTime = 100
		End
	End
End

