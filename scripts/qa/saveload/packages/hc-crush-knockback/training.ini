Object CrushCoverageUnit
    KindOf = INFANTRY SELECTABLE NO_COLLIDE IGNORE_FOR_VICTORY
    Geometry = CYLINDER
    GeometryMajorRadius = 3
    GeometryHeight = 4
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody CrushCoverageBody
            MaxHealth = 100
        End
    End
End

ChildObject CrushCoverageVictim CrushCoverageUnit
    CrushableLevel = 0
    AddModule
        Behavior = AIUpdateInterface CrushCoverageVictimAI
            AutoAcquireEnemiesWhenIdle = No
        End
    End
End

ChildObject CrushCoverageScanner CrushCoverageUnit
    CrusherLevel = 2
    CrushOnlyWhileCharging = No
    AddModule
        Behavior = PhysicsBehavior CrushCoveragePhysics
            Mass = 1
        End
        Behavior = NotifyTargetsOfImminentProbableCrushingUpdate CrushCoverageWarning
            TimeBetweenUpdatesMS = 600
            ScanAheadTimeMS = 400
            ScanHeight = 12
            ScanWidth = 8
        End
    End
End

ChildObject CrushCoverageSmallMarker CrushCoverageUnit
End

ChildObject CrushCoverageMediumMarker CrushCoverageUnit
End

ChildObject CrushCoverageLargeMarker CrushCoverageUnit
End

ObjectCreationList CrushCoverageSmallContact
    CreateObject
        ObjectNames = CrushCoverageSmallMarker
        Count = 1
        Disposition = LIKE_EXISTING
    End
End

ObjectCreationList CrushCoverageMediumContact
    CreateObject
        ObjectNames = CrushCoverageMediumMarker
        Count = 1
        Disposition = LIKE_EXISTING
    End
End

ObjectCreationList CrushCoverageLargeContact
    CreateObject
        ObjectNames = CrushCoverageLargeMarker
        Count = 1
        Disposition = LIKE_EXISTING
    End
End

ChildObject CrushCoverageContact CrushCoverageUnit
    AddModule
        Behavior = AODCrushCollide CrushCoverageContactModule
            Damage = 5
            DamageType = UNRESISTABLE
            SmallObjectCreationList = CrushCoverageSmallContact
            MediumObjectCreationList = CrushCoverageMediumContact
            LargeObjectCreationList = CrushCoverageLargeContact
        End
    End
End

ChildObject CrushCoverageMedium CrushCoverageUnit
    DeadCollideSize = MEDIUM
End

ChildObject CrushCoverageLarge CrushCoverageUnit
    DeadCollideSize = LARGE
End
