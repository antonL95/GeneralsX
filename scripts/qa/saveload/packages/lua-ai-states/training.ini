ChildObject LuaAIChantHorde MordorFighterHorde
End

Object LuaAIStateProbe
    KindOf = INFANTRY IMMOBILE IGNORE_FOR_VICTORY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody LuaAIStateBody
            MaxHealth = 1000
            InitialHealth = 1000
        End
    End
    AddModule
        Behavior = AIUpdateInterface LuaAIStateAI
            AutoAcquireEnemiesWhenIdle = No
        End
    End
    AddModule
        Behavior = EmotionTrackerUpdate LuaAIStateTracker
            AddEmotion = Alert_Base
            AddEmotion = FearIdle_Base
        End
    End
End
