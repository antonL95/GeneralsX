ChildObject SummonBusyBalrog MordorBalrog
	ReplaceModule ModuleTag_03
		Behavior = AIUpdateInterface ModuleTag_SummonBusyAI
			AutoAcquireEnemiesWhenIdle = No
			MoodAttackCheckRate = 500
			AILuaEventsList = BalrogFunctions
			AttackPriority = AttackPriority_SIEGEWEAPON
		End
	End
End

ObjectCreationList OCL_SummonBusyFinish
	CreateObject
		ObjectNames = SummonBusyBalrog
		Count = 1
		Disposition = ABSOLUTE_ANGLE
		DispositionAngle = 270
		UseJustBuiltFlag = Yes
		StartingBusyTime = 2300
		FadeIn = Yes
		FadeTime = 10000
		IgnoreCommandPointLimit = Yes
	End
End

ChildObject SummonBusyEgg MordorBalrogEgg
	ReplaceModule ModuleTag_HatchProcess
		Behavior = SlowDeathBehavior ModuleTag_SummonBusyRandom
			DestructionDelay = 8000
			OCL = MIDPOINT OCL_SummonBusyFinish
		End
	End
End

ObjectCreationList OCL_SummonBusyCast
	CreateObject
		ObjectNames = SummonBusyEgg
		Count = 1
		Disposition = LIKE_EXISTING
	End
	CreateObject
		ObjectNames = MordorBalrogEggPlaceHolder
		Count = 1
		Disposition = LIKE_EXISTING
	End
End

SpecialPower SummonBusySpell
	Enum = SPECIAL_GENERAL_TARGETLESS
	ReloadTime = 300000
	RadiusCursorRadius = 75.0
End

CommandButton Command_SummonBusySpell
	Command = SPECIAL_POWER
	SpecialPower = SummonBusySpell
	Options = NEED_TARGET_POS
End

CommandSet SummonBusyCommandSet
	1 = Command_SummonBusySpell
End

ChildObject SummonBusyCaster ArnorSpellBook
	CommandSet = SummonBusyCommandSet
	AddModule
		Behavior = OCLSpecialPower ModuleTag_SummonBusyCast
			SpecialPowerTemplate = SummonBusySpell
			OCL = OCL_SummonBusyCast
			CreateLocation = CREATE_AT_LOCATION
			AvailableAtStart = Yes
		End
	End
End

ChildObject SummonBusyFixedEgg MordorBalrogEgg
	ReplaceModule ModuleTag_HatchProcess
		Behavior = SlowDeathBehavior ModuleTag_SummonBusyFixed
			DestructionDelay = 2200
			DoNotRandomizeMidpoint = Yes
			OCL = MIDPOINT OCL_SummonBusyFinish
		End
	End
End
