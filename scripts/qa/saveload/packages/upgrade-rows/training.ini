Upgrade UpgradeRowsActivate
	Type = OBJECT
End

Object UpgradeRowsTower
	KindOf = STRUCTURE IMMOBILE NOT_AUTOACQUIRABLE
	VisionRange = 0
	ShroudClearingRange = 0
	RemoveModule ModuleTag_DefaultInactiveBody
	AddModule
		Body = ActiveBody UpgradeRowsBody
			MaxHealth = 100
		End
		Behavior = ObjectCreationUpgrade UpgradeRowsCreation
			TriggeredBy = UpgradeRowsActivate
			ThingToSpawn = UpgradeRowsPayload
			DestroyWhenSold = Yes
			DeathAnimAndDuration = AnimState:DEATH_2 AnimTime:400
			Offset = X:12 Y:0 Z:0
		End
		Behavior = SlaveWatcherBehavior UpgradeRowsWatcher
		End
	End
	Geometry = CYLINDER
	GeometryMajorRadius = 5
	GeometryHeight = 5
	GeometryIsSmall = Yes
End

Object UpgradeRowsPayload
	KindOf = IMMOBILE NOT_AUTOACQUIRABLE
	VisionRange = 0
	ShroudClearingRange = 0
	RemoveModule ModuleTag_DefaultInactiveBody
	RemoveModule ModuleTag_DefaultDestroyDie
	AddModule
		Body = ActiveBody UpgradeRowsBody
			MaxHealth = 100
		End
		Behavior = SlowDeathBehavior UpgradeRowsDeath
			DeathTypes = ALL
			DestructionDelay = 1000
		End
	End
	Geometry = CYLINDER
	GeometryMajorRadius = 3
	GeometryHeight = 5
	GeometryIsSmall = Yes
End

ChildObject UpgradeRowsChariot HaradKhandishChariot
	VisionRange = 0
	ShroudClearingRange = 0
	WeaponSet
		Conditions = NONE
		Weapon = PRIMARY None
		Weapon = SECONDARY None
		Weapon = TERTIARY None
	End
End
