Object VictoryFixtureCasualty
    KindOf = IMMOBILE MONSTER NO_COLLIDE NOT_AUTOACQUIRABLE
    ArmorSet
        Armor = NoArmor
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 2
    GeometryHeight = 8
    GeometryIsSmall = Yes
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody ModuleTag_VictoryBody
            MaxHealth = 10
        End
    End
End

Weapon VictoryFixtureVolley
    AttackRange = 80
    RadiusDamageAffects = ENEMIES
    DamageNugget
        Damage = 20
        Radius = 10
        DamageType = UNRESISTABLE
        DeathType = NORMAL
    End
End

Object VictoryFixtureShooter
    KindOf = IMMOBILE NO_COLLIDE
End

VictorySystemData default
    ScalePerLogicFrame = 0.8
    SubtractPerLogicFrame = 1
End

FactionVictoryData Men
    AllyDeathScaleFactor = 1
    EnemyKillScaleFactor = 1.1
    VictoryThreshold = 200
    MapToCellVictoryRatio = 0.5
    MajorUnitValue = 10
End
