Object CombatCoverageTarget
    BuildCost = 100
    KindOf = SELECTABLE IMMOBILE INFANTRY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody CombatCoverageBody
            MaxHealth = 100
        End
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 3
    GeometryMinorRadius = 3
    GeometryHeight = 10
    GeometryIsSmall = Yes
End

ChildObject CombatCoverageHealTarget CombatCoverageTarget
    AddModule
        Behavior = AutoHealBehavior CombatCoverageAutoHeal
            StartsActive = Yes
            HealingAmount = 5
            HealingDelay = 1000
            StartHealingDelay = 1000
        End
    End
End

ChildObject CombatCoverageStructure CombatCoverageTarget
    KindOf = SELECTABLE IMMOBILE STRUCTURE
End

ChildObject CombatCoverageOverrideTarget CombatCoverageTarget
    ReplaceModule CombatCoverageBody
        Body = ActiveBody CombatCoverageOverrideBody
            MaxHealth = 1000
        End
    End
End

