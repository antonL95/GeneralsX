ChildObject DefaultStatesTower GuldurRuinousTower
End

ChildObject DefaultStatesArchers ElvenMirkwoodArcherHorde
End

ChildObject DefaultStatesSentries ElvenMithlondSentryHorde
End

Weapon DefaultStatesStrafeWeapon
  AttackRange = 100
End

ChildObject DefaultStatesDrake SpellBookDragonStrikeDragon
  ReplaceModule ModuleTag_Strafe
    Behavior = StrafeAreaUpdate DefaultStatesStrafe
      WeaponName = DefaultStatesStrafeWeapon
      StrafeAreaRadius = 250
      Sweepfrequency = 0.50
      SweepAmplitude = 90
      Slope = 50
      InitialSweepPhase = 1.57
    End
  End
End

ObjectCreationList DefaultStatesDrakeStrikeList
  CreateObject
    ObjectNames = DefaultStatesDrake
    IssueMoveAfterCreation = Yes
    MoveUsesStrafeUpdate = Yes
  End
End

ChildObject DefaultStatesCaster ArnorSpellBook
  AddModule
    Behavior = OCLSpecialPower DefaultStatesStrikePower
      SpecialPowerTemplate = SpellBookDragonStrike
      OCL = DefaultStatesDrakeStrikeList
      CreateLocation = CREATE_AT_EDGE_NEAR_TARGET_AND_MOVE_TO_LOCATION
      AvailableAtStart = Yes
    End
  End
End
