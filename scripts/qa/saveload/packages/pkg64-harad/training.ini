Object Pkg64Source
    KindOf = IMMOBILE SELECTABLE
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody Pkg64SourceBody
            MaxHealth = 1000
        End
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 4
    GeometryHeight = 8
    GeometryIsSmall = Yes
End

ChildObject Pkg64Removable Pkg64Source
    KindOf = IMMOBILE CLEARED_BY_BUILD
End

Object Pkg64Mover
    KindOf = SELECTABLE INFANTRY
    VisionRange = 0
    ShroudClearingRange = 0
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody Pkg64MoverBody
            MaxHealth = 1000
        End
    End
    AddModule
        Behavior = AIUpdateInterface Pkg64MoverAI
            AutoAcquireEnemiesWhenIdle = No
        End
    End
    AddModule
        Behavior = PhysicsBehavior Pkg64MoverPhysics
        End
    End
    LocomotorSet
        Locomotor = HumanLocomotor
        Condition = SET_NORMAL
        Speed = 30
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 3
    GeometryHeight = 8
    GeometryIsSmall = Yes
End

ChildObject Pkg64Facing Pkg64Source
End

ObjectCreationList Pkg64FaceSecondary
    CreateObject
        ObjectNames = Pkg64Facing
        Disposition = RELATIVE_ANGLE
        DispositionAngle = 0
        OrientInPrimaryDirection = Yes
        OrientInSecondaryDirection = Yes
        OrientationOffset = 45
        IssueMoveAfterCreation = No
    End
End

ObjectCreationList Pkg64FacePrimary
    CreateObject
        ObjectNames = Pkg64Facing
        Disposition = LIKE_EXISTING
        OrientInPrimaryDirection = Yes
        OrientationOffset = 45
        IssueMoveAfterCreation = No
    End
End

ObjectCreationList Pkg64Move
    CreateObject
        ObjectNames = Pkg64Mover
        Disposition = ABSOLUTE_ANGLE
        Offset = X:20 Y:0 Z:0
        IssueMoveAfterCreation = Yes
    End
End

ObjectCreationList Pkg64Hold
    CreateObject
        ObjectNames = Pkg64Mover
