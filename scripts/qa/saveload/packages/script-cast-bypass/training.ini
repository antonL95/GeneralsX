SpecialPower ScriptBypassPower
	Enum = SPECIAL_SPELL_BOOK_HEAL
	ReloadTime = 4000
End

CommandButton ScriptBypassButton
	Command = SPECIAL_POWER
	SpecialPower = ScriptBypassPower
	Options = NEED_TARGET_POS
End

CommandSet ScriptBypassCommandSet
	1 = ScriptBypassButton
End

ChildObject ScriptBypassMarker GondorFighter
	CommandPoints = 0
End

ChildObject ScriptBypassTarget GondorFighter
	CommandPoints = 0
End

ObjectCreationList ScriptBypassOCL
	CreateObject
		ObjectNames = ScriptBypassMarker
		Count = 1
		Disposition = LIKE_EXISTING
		IgnoreCommandPointLimit = Yes
	End
End

Object ScriptBypassCaster
	KindOf = STRUCTURE IMMOBILE IGNORE_FOR_VICTORY
	CommandSet = ScriptBypassCommandSet
	RemoveModule ModuleTag_DefaultInactiveBody
	AddModule
		Body = ActiveBody ScriptBypassCasterBody
			MaxHealth = 1000
		End
		Behavior = OCLSpecialPower ScriptBypassPowerModule
			SpecialPowerTemplate = ScriptBypassPower
			OCL = ScriptBypassOCL
			CreateLocation = CREATE_AT_LOCATION
			AvailableAtStart = Yes
			StartsPaused = Yes
		End
	End
End
