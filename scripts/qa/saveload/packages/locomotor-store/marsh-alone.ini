Locomotor BombardShipLocomotor
	Surfaces = WATER
	AllowAirborneMotiveForce = Yes
	Acceleration = 600
	Braking = 600
End

Locomotor LargeShipLocomotor
	Surfaces = WATER
	AllowAirborneMotiveForce = Yes
	RiverModifier = 100%
	Acceleration = 600
	Braking = 600
End

Object P63StoreBombard
	KindOf = VEHICLE BOAT SELECTABLE NO_COLLIDE IGNORE_FOR_VICTORY
	VisionRange = 0
	ShroudClearingRange = 0
	Geometry = CYLINDER
	GeometryMajorRadius = 3
	GeometryHeight = 4
	RemoveModule ModuleTag_DefaultInactiveBody
	AddModule
		Body = ActiveBody P63StoreShipBody
			MaxHealth = 100
		End
		Behavior = AIUpdateInterface P63StoreShipAI
			AutoAcquireEnemiesWhenIdle = No
		End
		Behavior = PhysicsBehavior P63StoreShipPhysics
			Mass = 1
		End
	End
	LocomotorSet
		Locomotor = BombardShipLocomotor
		Condition = SET_NORMAL
		Speed = 30
	End
End

ChildObject P63StoreFullSpeedShip P63StoreBombard
	LocomotorSet
		Locomotor = LargeShipLocomotor
		Condition = SET_NORMAL
		Speed = 30
	End
End
