Object CollapseFixtureDebris
    KindOf = IMMOBILE NO_COLLIDE
End

ObjectCreationList CollapseFixtureLateDebris
    CreateObject
        ObjectNames = CollapseFixtureDebris
        Count = 1
        Disposition = LIKE_EXISTING
    End
End

Object CollapseFixtureSink
    KindOf = STRUCTURE IMMOBILE SELECTABLE
    Geometry = BOX
    GeometryMajorRadius = 12
    GeometryMinorRadius = 12
    GeometryHeight = 40
    GeometryIsSmall = No
    RemoveModule ModuleTag_DefaultInactiveBody
    RemoveModule ModuleTag_DefaultDestroyDie
    AddModule
        Body = ActiveBody ModuleTag_Body
            MaxHealth = 100
        End
        Behavior = StructureCollapseUpdate ModuleTag_Collapse
            MinCollapseDelay = 400
            MaxCollapseDelay = 400
            MinBurstDelay = 1000
            MaxBurstDelay = 1000
            BigBurstFrequency = 1
            CollapseDamping = 0.5
            CollapseHeight = 89
            DestroyObjectWhenDone = Yes
            OCL = ALMOST_FINAL CollapseFixtureLateDebris
        End
    End
End

ChildObject CollapseFixtureKeep CollapseFixtureSink
    ReplaceModule ModuleTag_Collapse
        Behavior = StructureCollapseUpdate ModuleTag_KeepCollapse
            MinBurstDelay = 200
            MaxBurstDelay = 200
            BigBurstFrequency = 1
            CollapseHeight = 0
            DestroyObjectWhenDone = No
        End
    End
End

ChildObject CollapseFixtureAttacker GondorFighter
End
