Upgrade Pkg32Old
    Type = OBJECT
    GroupName = Pkg32Choice
End

Upgrade Pkg32Choice
    Type = OBJECT
    GroupName = Pkg32Choice
End

Upgrade Pkg32Bystander
    Type = OBJECT
End

Upgrade Pkg32Player
    Type = PLAYER
End

Upgrade Pkg32RemoveAll
    Type = OBJECT
End

Upgrade Pkg32Instant
    Type = OBJECT
End

Upgrade Pkg32Short
    Type = OBJECT
End

Upgrade Pkg32Long
    Type = OBJECT
End

Upgrade Pkg32Suppress
    Type = OBJECT
End

Upgrade Pkg32Conflict
    Type = OBJECT
End

Weapon Pkg32BaseWeapon
    AttackRange = 1
End

Weapon Pkg32AlternateWeapon
    AttackRange = 1
End

Object Pkg32Probe
    KindOf = IMMOBILE
    AddModule
        Body = ActiveBody ModuleTag_Body
            MaxHealth = 100
        End
    End
    WeaponSet
        Conditions = NONE
        Weapon = PRIMARY Pkg32BaseWeapon
        AutoChooseSources = PRIMARY NONE
    End
    WeaponSet
        Conditions = WEAPONSET_TOGGLE_1
        Weapon = PRIMARY Pkg32AlternateWeapon
        AutoChooseSources = PRIMARY NONE
    End
    AddModule
        Behavior = ModelConditionUpgrade ModuleTag_OutsideRange
            TriggeredBy = Pkg32Bystander
            AddConditionFlags = USER_15
            Permanent = Yes
        End
    End
    AddModule
        Behavior = ModelConditionUpgrade ModuleTag_DefaultAppearance
            TriggeredBy = Pkg32Old
            AddConditionFlags = CREATE_A_HERO_00 CREATE_A_HERO_01 CREATE_A_HERO_03
        End
    End
    AddModule
        Behavior = ModelConditionUpgrade ModuleTag_AlternateAppearance
            TriggeredBy = Pkg32Choice
            RemoveConditionFlagsInRange = CREATE_A_HERO_00 CREATE_A_HERO_03
            AddConditionFlags = CREATE_A_HERO_02
        End
    End
    AddModule
        Behavior = RemoveUpgradeUpgrade ModuleTag_RemoveOtherChoices
            TriggeredBy = Pkg32Choice
            UpgradeGroupsToRemove = Pkg32Choice
        End
    End
    AddModule
        Behavior = RemoveUpgradeUpgrade ModuleTag_RemoveAll
            TriggeredBy = Pkg32RemoveAll
            UpgradeToRemove = Pkg32Player Pkg32Bystander
            RemoveFromAllPlayerObjects = Yes
            SuppressEvaEventForRemoval = Yes
        End
    End
    AddModule
        Behavior = ModelConditionUpgrade ModuleTag_RemovedTrigger
            TriggeredBy = Pkg32Player Pkg32RemoveAll
            RequiresAllTriggers = Yes
            AddConditionFlags = USER_14
        End
    End
    AddModule
        Behavior = StatusBitsUpgrade ModuleTag_ChangeStatus
            TriggeredBy = Pkg32Player
            StatusToSet = UNSELECTABLE
            CustomAnimAndDuration = AnimState:USER_4 AnimTime:0
        End
    End
    AddModule
        Behavior = WeaponSetUpgrade ModuleTag_AlternateWeapon
            TriggeredBy = Pkg32Short
            WeaponCondition = WEAPONSET_TOGGLE_1
            CustomAnimAndDuration = AnimState:USER_5 AnimTime:1000
        End
    End
    AddModule
        Behavior = SubObjectsUpgrade ModuleTag_AnimatedSubObjects
            TriggeredBy = Pkg32Long
            ConflictsWith = Pkg32Conflict
            CustomAnimAndDuration = AnimState:USER_16 AnimTime:2100
        End
    End
    AddModule
        Behavior = ModelConditionUpgrade ModuleTag_Subframe
            TriggeredBy = Pkg32Instant
            AddTempConditionFlag = ModelConditionState:USER_8
            TempConditionTime = 0.01
        End
    End
    AddModule
        Behavior = ModelConditionUpgrade ModuleTag_InitialTimer
            TriggeredBy = Pkg32Short
            AddTempConditionFlag = ModelConditionState:USER_9
            TempConditionTime = 1.0
        End
    End
    AddModule
        Behavior = ModelConditionUpgrade ModuleTag_RefreshTimer
            TriggeredBy = Pkg32Long
            AddTempConditionFlag = ModelConditionState:USER_9
            TempConditionTime = 2.0
        End
    End
    AddModule
        Behavior = RemoveUpgradeUpgrade ModuleTag_RemoveLocal
            TriggeredBy = Pkg32Suppress
            UpgradeToRemove = Pkg32Bystander
        End
    End
End

Object Pkg32BystanderObject
    KindOf = IMMOBILE
    AddModule
        Body = ActiveBody ModuleTag_Body
            MaxHealth = 100
        End
    End
End

