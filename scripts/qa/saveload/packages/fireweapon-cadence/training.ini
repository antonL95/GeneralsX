Weapon CadenceFixtureZeroWeapon
    AttackRange = 40
    DelayBetweenShots = 0
    RadiusDamageAffects = ENEMIES
    DamageNugget
        Damage = 10
        Radius = 25
        DamageType = UNRESISTABLE
    End
End

Weapon CadenceFixtureDelayedWeapon
    AttackRange = 40
    DelayBetweenShots = 500
    RadiusDamageAffects = ENEMIES
    DamageNugget
        Damage = 10
        Radius = 25
        DamageType = UNRESISTABLE
    End
End

Object CadenceFixtureZero
    KindOf = IMMOBILE NO_COLLIDE
    AddModule
        Behavior = FireWeaponUpdate ModuleTag_Cadence
            FireWeaponNugget
                WeaponName = CadenceFixtureZeroWeapon
                FireDelay = 0
                OneShot = No
            End
        End
    End
End

Object CadenceFixtureDelayed
    KindOf = IMMOBILE NO_COLLIDE
    AddModule
        Behavior = FireWeaponUpdate ModuleTag_Cadence
            FireWeaponNugget
                WeaponName = CadenceFixtureDelayedWeapon
                FireDelay = 500
                OneShot = No
            End
        End
    End
End

ChildObject CadenceFixtureDeathSpawn CadenceFixtureZero
End

ObjectCreationList CadenceFixtureDeathOCL
    CreateObject
        ObjectNames = CadenceFixtureDeathSpawn
        Count = 1
        Disposition = LIKE_EXISTING
    End
End

Object CadenceFixtureEgg
    KindOf = IMMOBILE NO_COLLIDE
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody ModuleTag_Body
            MaxHealth = 1
        End
        Behavior = CreateObjectDie ModuleTag_Create
            CreationList = CadenceFixtureDeathOCL
        End
        Behavior = DestroyDie ModuleTag_Destroy
        End
    End
End

Object CadenceFixtureTarget
    KindOf = IMMOBILE INFANTRY
    Geometry = CYLINDER
    GeometryMajorRadius = 2
    GeometryHeight = 8
    GeometryIsSmall = Yes
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody ModuleTag_Body
            MaxHealth = 1000
        End
    End
End
