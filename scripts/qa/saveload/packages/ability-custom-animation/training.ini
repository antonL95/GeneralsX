Upgrade AbilityCustomAnimationProbe
    Type = OBJECT
End

SpecialPower AbilityCustomAnimationCast
    Enum = SPECIAL_GENERAL_TARGETLESS
    ReloadTime = 5000
End

ChildObject AbilityCustomDelayed GondorPippin
    AddModule
        Behavior = SpecialPowerModule ModuleTag_CustomAnimationPower
            SpecialPowerTemplate = AbilityCustomAnimationCast
            UpdateModuleStartsAttack = Yes
        End
        Behavior = SpecialAbilityUpdate ModuleTag_CustomAnimationUpdate
            SpecialPowerTemplate = AbilityCustomAnimationCast
            UnpackTime = 1000
            PreparationTime = 300
            PackTime = 2000
            CustomAnimAndDuration = AnimState:SPECIAL_WEAPON_TWO AnimTime:401 TriggerTime:401
        End
        Behavior = ModelConditionUpgrade ModuleTag_AbilityCustomAnimationProbe
            TriggeredBy = AbilityCustomAnimationProbe
            AddTempConditionFlag = ModelConditionState:USER_3
            TempConditionTime = 2.0
        End
    End
End

ChildObject AbilityCustomNoUnpack GondorPippin
    AddModule
        Behavior = SpecialPowerModule ModuleTag_CustomAnimationPower
            SpecialPowerTemplate = AbilityCustomAnimationCast
            UpdateModuleStartsAttack = Yes
        End
        Behavior = SpecialAbilityUpdate ModuleTag_CustomAnimationUpdate
            SpecialPowerTemplate = AbilityCustomAnimationCast
            PreparationTime = 300
            CustomAnimAndDuration = AnimState:SPECIAL_WEAPON_TWO AnimTime:1000
        End
    End
End

ChildObject AbilityCustomLatched GondorPippin
    AddModule
        Behavior = SpecialPowerModule ModuleTag_CustomAnimationPower
            SpecialPowerTemplate = AbilityCustomAnimationCast
            UpdateModuleStartsAttack = Yes
        End
        Behavior = SpecialAbilityUpdate ModuleTag_CustomAnimationUpdate
            SpecialPowerTemplate = AbilityCustomAnimationCast
            UnpackTime = 200
            PreparationTime = 200
            PackTime = 200
            CustomAnimAndDuration = AnimState:SPECIAL_WEAPON_TWO AnimTime:0
        End
    End
End
