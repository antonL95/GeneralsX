Object Pkg60CheerWitness
    KindOf = SELECTABLE IMMOBILE INFANTRY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody Pkg60WitnessBody
            MaxHealth = 100
        End
    End
    AddModule
        Behavior = EmotionTrackerUpdate Pkg60WitnessEmotions
            AddEmotion = CheerIdle_Base
        End
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 3
    GeometryMinorRadius = 3
    GeometryHeight = 10
    GeometryIsSmall = Yes
End

ChildObject Pkg60Shooter Pkg60CheerWitness
    RemoveModule Pkg60WitnessEmotions
End

FXList Pkg60HealingFX
    PlayEvenIfShrouded = Yes
    ParticleSystem
        Name = GPUUnitFire
        AttachToObject = Yes
    End
End

ChildObject Pkg60HealingAicanaroc HaradAicanaroc
    ReplaceModule ModuleTag_02
        Body = ActiveBody Pkg60HealingBody
            MaxHealth = 1000
            HealingBuffFx = Pkg60HealingFX
        End
    End
End

