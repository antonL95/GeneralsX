Object LuaActionVictim
    KindOf = IMMOBILE IGNORE_FOR_VICTORY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody LuaActionVictimBody
            MaxHealth = 1000
            InitialHealth = 1000
        End
        Behavior = DestroyDie LuaActionVictimDie
        End
    End
End

Object LuaActionPing
    KindOf = IMMOBILE IGNORE_FOR_VICTORY
    AddModule
        Behavior = AIUpdateInterface LuaActionPingAI
            AILuaEventsList = PvPModePingFunctions
        End
    End
End
