Object ScriptRecruitRadiusUnit
    KindOf = INFANTRY IMMOBILE UNATTACKABLE IGNORE_FOR_VICTORY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody ScriptRecruitRadiusBody
            MaxHealth = 10
            InitialHealth = 10
        End
        Behavior = AIUpdateInterface ScriptRecruitRadiusAI
        End
    End
End

Object ScriptRecruitRadiusEmptyUnit
    KindOf = INFANTRY IMMOBILE UNATTACKABLE IGNORE_FOR_VICTORY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody ScriptRecruitRadiusEmptyBody
            MaxHealth = 10
            InitialHealth = 10
        End
        Behavior = AIUpdateInterface ScriptRecruitRadiusEmptyAI
        End
    End
End
