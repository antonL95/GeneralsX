SpecialPower DominateRevertTestPower
    Enum = SPECIAL_DOMINATE_ENEMY
    ReloadTime = 4000
End

CommandButton Command_DominateRevertTest
    Command = SPECIAL_POWER
    SpecialPower = DominateRevertTestPower
    Options = NEED_TARGET_ENEMY_OBJECT NEED_TARGET_NEUTRAL_OBJECT
End

CommandSet DominateRevertCasterCommands
    1 = Command_DominateRevertTest
End

Object DominateRevertCasterAlive
    KindOf = INFANTRY SELECTABLE
    CommandSet = DominateRevertCasterCommands
    VisionRange = 100
    ShroudClearingRange = 100

    RemoveModule ModuleTag_DefaultInactiveBody

    AddModule
        Body = ActiveBody ModuleTag_Body
            MaxHealth = 100
        End

        Behavior = AIUpdateInterface ModuleTag_AI
        End

        Behavior = SpecialPowerModule ModuleTag_Power
            SpecialPowerTemplate = DominateRevertTestPower
            UpdateModuleStartsAttack = Yes
            StartsReady = Yes
            StartsPaused = No
        End

        Behavior = DominateEnemySpecialPower ModuleTag_Dominate
            SpecialPowerTemplate = DominateRevertTestPower
            Instant = Yes
            EffectDuration = 3100
            PermanentlyConvert = No
        End
    End

    Geometry = CYLINDER
    GeometryMajorRadius = 3
    GeometryHeight = 6
End

ChildObject DominateRevertCasterKilled DominateRevertCasterAlive
End

ChildObject DominateRevertCasterDeleted DominateRevertCasterAlive
End

ChildObject DominateRevertCasterRecast DominateRevertCasterAlive
End

Object DominateRevertVictimAlive
    KindOf = INFANTRY

    RemoveModule ModuleTag_TemporarilyDefectUpdate
    RemoveModule ModuleTag_DefaultInactiveBody

    AddModule
        Behavior = TemporarilyDefectUpdate ModuleTag_DominateRevert
            DefectDuration = 3100
        End

        Body = ActiveBody ModuleTag_Body
            MaxHealth = 100
        End
    End

    Geometry = CYLINDER
    GeometryMajorRadius = 3
    GeometryHeight = 6
End

ChildObject DominateRevertVictimKilled DominateRevertVictimAlive
End

ChildObject DominateRevertVictimDeleted DominateRevertVictimAlive
End
