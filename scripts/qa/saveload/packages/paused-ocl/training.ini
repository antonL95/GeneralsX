ChildObject PausedOclFortress RivendellFortressCitadel
	RemoveModule AutoDepositModuleTag
	ReplaceModule ModuleTag_SummonTheGodDamnCirdan
		Behavior = OCLSpecialPower PausedOclCirdanPower
			SpecialPowerTemplate = SpecialAbilityActivateeDummy
			OCL = PausedOclCirdanMarkerList
			CreateLocation = CREATE_AT_LOCATION
			StartsPaused = Yes
		End
	End
	ReplaceModule ModuleTag_CirdanPower
		Behavior = ActivateModuleSpecialPower PausedOclCirdanActivator
			SpecialPowerTemplate = CallofBelegaer
			StartAbilityRange = 500
			TriggerSpecialPower = PausedOclCirdanPower OBJECTPOS
			TriggerSpecialPower = ModuleTag_LightningRecharge OBJECTPOS
			TriggerSpecialPower = ModuleTag_EagleRecharge OBJECTPOS
			ParalyzeDurationWhenCompleted = 500
			NeedCollisionBeforeTrigger = No
			ApproachUntilMembersInRange = No
			ApproachRequiresLOS = No
			MustFinishAbility = Yes
			Instant = Yes
		End
	End
End

