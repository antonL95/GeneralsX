Weapon ForestFireTestWeapon
    AttackRange = 200
    DelayBetweenShots = 500
    DamageNugget
        Damage = 100
        DamageType = FLAME
    End
End

ChildObject ForestFireAttacker GondorFighter
    VisionRange = 300
    WeaponSet
        Conditions = None
        Weapon = PRIMARY ForestFireTestWeapon
    End
    ReplaceModule ModuleTag_03
        Behavior = AIUpdateInterface ForestFireAttackerAI
            AutoAcquireEnemiesWhenIdle = No
        End
    End
End

ChildObject ForestFireIdleArcher GondorFighter
    VisionRange = 180
    WeaponSet
        Conditions = None
        Weapon = PRIMARY ForestFireTestWeapon
    End
    ReplaceModule ModuleTag_03
        Behavior = AIUpdateInterface ForestFireIdleArcherAI
            AutoAcquireEnemiesWhenIdle = YES
        End
    End
End

Object ForestFireNeutralTree
    KindOf = SHRUBBERY IMMOBILE TREE SELECTABLE
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody ForestFireNeutralTreeBody
            MaxHealth = 1000
            InitialHealth = 1000
        End
    End
End
