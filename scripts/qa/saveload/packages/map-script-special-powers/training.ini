SpecialPower MapScriptPowerFixture
    Enum = SPECIAL_AT_VISIBLE_OBJECT
    ReloadTime = 0
End

CommandButton MapScriptPowerButton
    Command = SPECIAL_POWER
    SpecialPower = MapScriptPowerFixture
    AutoAbility = Yes
End

CommandSet MapScriptPowerCommandSet
    1 = MapScriptPowerButton
End

Object MapScriptPowerMarker
    KindOf = IMMOBILE NO_COLLIDE IGNORE_FOR_VICTORY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody MapScriptPowerMarkerBody
            MaxHealth = 100
        End
    End
End

ObjectCreationList MapScriptPowerOCL
    CreateObject
        ObjectNames = MapScriptPowerMarker
        Count = 1
        Disposition = LIKE_EXISTING
    End
End

Object MapScriptPowerCaster
    KindOf = SELECTABLE IMMOBILE IGNORE_FOR_VICTORY
    CommandSet = MapScriptPowerCommandSet
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody MapScriptPowerCasterBody
            MaxHealth = 100
        End
    End
    AddModule
        Behavior = OCLSpecialPower MapScriptPowerModule
            SpecialPowerTemplate = MapScriptPowerFixture
            OCL = MapScriptPowerOCL
            CreateLocation = CREATE_AT_LOCATION
        End
    End
    AddModule
        Behavior = AutoAbilityBehavior MapScriptPowerAutoModule
            SpecialAbility = MapScriptPowerFixture
            StartsActive = No
        End
    End
End

ChildObject MapScriptPowerReference MapScriptPowerMarker
End

ChildObject MapScriptPowerTarget MapScriptPowerReference
End
