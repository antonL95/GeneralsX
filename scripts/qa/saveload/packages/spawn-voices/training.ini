AudioEvent SpawnVoicesCreated
	Sounds = beregond_capture01
	Type = world global player voice
	SubmixSlider = voice
End

AudioEvent SpawnVoicesInitial
	Sounds = beregond_salute01
	Type = world global player voice
	SubmixSlider = voice
End

AudioEvent SpawnVoicesRevived
	Sounds = beregond_respawn01
	Type = world global player voice
	SubmixSlider = voice
End

FXList SpawnVoicesInitialFX
	PlayEvenIfShrouded = Yes
	Sound
		Name = SpawnVoicesInitial
	End
End

FXList SpawnVoicesRevivedFX
	PlayEvenIfShrouded = Yes
	Sound
		Name = SpawnVoicesRevived
	End
End

ChildObject SpawnVoicesHero GondorBeregond
	EquivalentTo = GondorBeregond
	BuildCost = 0
	BuildTime = 1
	CommandPoints = 0
	VoiceCreated = SpawnVoicesCreated
	ReplaceModule ModuleTag_RespawnUpdate
		Behavior = RespawnUpdate ModuleTag_SpawnVoicesRespawn
			InitialSpawnFX = SpawnVoicesInitialFX
			RespawnFX = SpawnVoicesRevivedFX
			RespawnRules = AutoSpawn:No Cost:0 Time:1000 Health:100%
		End
	End
End

CommandButton SpawnVoicesTrainHero
	Command = UNIT_BUILD
	Object = SpawnVoicesHero
End

CommandSet SpawnVoicesProducerCommands
	1 = SpawnVoicesTrainHero
End

ChildObject SpawnVoicesProducer GondorBarracks
	CommandSet = SpawnVoicesProducerCommands
End
