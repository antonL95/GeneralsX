ChildObject MapScriptUnitOpsProbe GondorFighter
    VisionRange = 0
End

Object MapScriptUnitOpsXP
    KindOf = SELECTABLE IMMOBILE IGNORE_FOR_VICTORY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody MapScriptUnitOpsXPBody
            MaxHealth = 10
        End
    End
End

ChildObject MapScriptVeterancyProbe MapScriptUnitOpsXP
End

ChildObject MapScriptThreatProbe MapScriptUnitOpsXP
    KindOf = SELECTABLE IMMOBILE IGNORE_FOR_VICTORY NOT_AUTOACQUIRABLE
    ThreatLevel = 40
End

ChildObject MapScriptScoreTarget MapScriptUnitOpsXP
    KindOf = SELECTABLE IMMOBILE SCORE IGNORE_FOR_VICTORY NOT_AUTOACQUIRABLE
End

ChildObject MapScriptScoreBuilding MapScriptUnitOpsXP
    KindOf = SELECTABLE IMMOBILE STRUCTURE SCORE_DESTROY IGNORE_FOR_VICTORY NOT_AUTOACQUIRABLE
End

ChildObject MapScriptEmotionProbe MapScriptUnitOpsXP
    KindOf = SELECTABLE IMMOBILE IGNORE_FOR_VICTORY NOT_AUTOACQUIRABLE
    AddModule
        Behavior = EmotionTrackerUpdate MapScriptEmotionTracker
            AddEmotion = Terror_Base
        End
    End
End
