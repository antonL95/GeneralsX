SpecialPower AiPowers2Heal
    Enum = SPECIAL_GENERAL_TARGETLESS
    ReloadTime = 300000
End

CommandButton AiPowers2HealButton
    Command = SPECIAL_POWER
    SpecialPower = AiPowers2Heal
End

CommandSet AiPowers2HealCommands
    1 = AiPowers2HealButton
End

Object AiPowers2Hero
    KindOf = INFANTRY HERO SELECTABLE IMMOBILE IGNORE_FOR_VICTORY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody ModuleTag_AiPowers2Health
            MaxHealth = 1000
        End
    End
End

ChildObject AiPowers2Infantry AiPowers2Hero
    KindOf = INFANTRY SELECTABLE IMMOBILE IGNORE_FOR_VICTORY
End

ChildObject AiPowers2Healer AiPowers2Hero
    CommandSet = AiPowers2HealCommands
    AddModule
        Behavior = AIUpdateInterface ModuleTag_AiPowers2HealerAI
            AutoAcquireEnemiesWhenIdle = No
        End
        Behavior = PlayerHealSpecialPower ModuleTag_AiPowers2Heal
            SpecialPowerTemplate = AiPowers2Heal
            UpdateModuleStartsAttack = Yes
            AvailableAtStart = Yes
            HealAmount = 300
            HealAsPercent = No
            HealAffects = HERO
            HealRadius = 50
        End
        Behavior = SpecialAbilityUpdate ModuleTag_AiPowers2HealEffect
            SpecialPowerTemplate = AiPowers2Heal
            UnpackTime = 3500
            PreparationTime = 1
            PackTime = 200
        End
        Behavior = AISpecialPowerUpdate ModuleTag_AiPowers2HealAI
            CommandButtonName = AiPowers2HealButton
            SpecialPowerAIType = AI_SPECIAL_POWER_SELFAOEHEALHEROS
            SpecialPowerRadius = 50
        End
    End
End

Weapon AiPowers2BasicWeapon
    AttackRange = 180
    DelayBetweenShots = 100000
    DamageNugget
        Damage = 1
        DamageType = SLASH
    End
End

Weapon AiPowers2WizardWeapon
    AttackRange = 125
    DamageNugget
        Damage = 30
        Radius = 12
        DamageType = MAGIC
    End
End

ChildObject AiPowers2ClusterCaster AiPowers2Hero
    KindOf = INFANTRY HERO SELECTABLE CAN_ATTACK IGNORE_FOR_VICTORY
    VisionRange = 230
    ShroudClearingRange = 230
    WeaponSet
        Conditions = None
        Weapon = PRIMARY AiPowers2BasicWeapon
    End
    AddModule
        Behavior = AIUpdateInterface ModuleTag_AiPowers2ClusterAI
            AutoAcquireEnemiesWhenIdle = No
        End
    End
End

ChildObject AiPowers2ClusterTarget AiPowers2Infantry
End

SpecialPower AiPowers2Wizard
    Enum = SPECIAL_AT_VISIBLE_OBJECT
    ReloadTime = 300000
End

CommandButton AiPowers2WizardButton
    Command = SPECIAL_POWER
    SpecialPower = AiPowers2Wizard
    Options = NEED_TARGET_ENEMY_OBJECT
End

CommandSet AiPowers2WizardCommands
    1 = AiPowers2WizardButton
End

ChildObject AiPowers2WizardCaster AiPowers2ClusterCaster
    CommandSet = AiPowers2WizardCommands
    AddModule
        Behavior = SpecialPowerModule ModuleTag_AiPowers2WizardStarter
            SpecialPowerTemplate = AiPowers2Wizard
            UpdateModuleStartsAttack = Yes
            AvailableAtStart = Yes
        End
        Behavior = WeaponFireSpecialAbilityUpdate ModuleTag_AiPowers2WizardEffect
            SpecialPowerTemplate = AiPowers2Wizard
            StartAbilityRange = 100
            MustFinishAbility = Yes
            UnpackTime = 3500
            PreparationTime = 1
            PackTime = 200
            SpecialWeapon = AiPowers2WizardWeapon
        End
        Behavior = AISpecialPowerUpdate ModuleTag_AiPowers2WizardAI
            CommandButtonName = AiPowers2WizardButton
            SpecialPowerAIType = AI_SPECIAL_POWER_GANDALF_WIZARD_BLAST
            SpecialPowerRadius = 50
        End
    End
End

SpecialPower AiPowers2Deep
    Enum = SPECIAL_GENERAL_TARGETLESS
    ReloadTime = 300000
End

CommandButton AiPowers2DeepButton
    Command = SPECIAL_POWER
    SpecialPower = AiPowers2Deep
    Options = NEED_TARGET_POS
End

CommandSet AiPowers2DeepCommands
    1 = AiPowers2DeepButton
End

ChildObject AiPowers2DeepMarker AiPowers2Infantry
    KindOf = INFANTRY SELECTABLE IMMOBILE IGNORE_FOR_VICTORY SUMMONED
End

ObjectCreationList AiPowers2DeepList
    CreateObject
        ObjectNames = AiPowers2DeepMarker
        Count = 1
        Disposition = LIKE_EXISTING
    End
End

ChildObject AiPowers2DeepCaster AiPowers2ClusterCaster
    CommandSet = AiPowers2DeepCommands
    AddModule
        Behavior = OCLSpecialPower ModuleTag_AiPowers2DeepPower
            SpecialPowerTemplate = AiPowers2Deep
            AvailableAtStart = Yes
            CreateLocation = CREATE_AT_LOCATION
            OCL = AiPowers2DeepList
        End
        Behavior = AISpecialPowerUpdate ModuleTag_AiPowers2DeepAI
            CommandButtonName = AiPowers2DeepButton
            SpecialPowerAIType = AI_SPECIAL_POWER_GOBLINKING_CALLOFTHEDEEP
            SpecialPowerRange = 70
        End
    End
End
