SpecialPower AiPowers2Heal
    Enum = SPECIAL_GENERAL_TARGETLESS
    ReloadTime = 300000
End

CommandButton AiPowers2HealButton
    Command = SPECIAL_POWER
    SpecialPower = AiPowers2Heal
End

CommandSet AiPowers2HealCommands
    1 = AiPowers2HealButton
End

Object AiPowers2Hero
    KindOf = INFANTRY HERO SELECTABLE IMMOBILE IGNORE_FOR_VICTORY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody ModuleTag_AiPowers2Health
            MaxHealth = 1000
        End
    End
End

ChildObject AiPowers2Infantry AiPowers2Hero
    KindOf = INFANTRY SELECTABLE IMMOBILE IGNORE_FOR_VICTORY
End

ChildObject AiPowers2Healer AiPowers2Hero
    CommandSet = AiPowers2HealCommands
    AddModule
        Behavior = AIUpdateInterface ModuleTag_AiPowers2HealerAI
            AutoAcquireEnemiesWhenIdle = No
        End
        Behavior = PlayerHealSpecialPower ModuleTag_AiPowers2Heal
            SpecialPowerTemplate = AiPowers2Heal
            UpdateModuleStartsAttack = Yes
            AvailableAtStart = Yes
            HealAmount = 300
            HealAsPercent = No
            HealAffects = HERO
            HealRadius = 50
        End
        Behavior = SpecialAbilityUpdate ModuleTag_AiPowers2HealEffect
            SpecialPowerTemplate = AiPowers2Heal
            UnpackTime = 3500
            PreparationTime = 1
            PackTime = 200
        End
        Behavior = AISpecialPowerUpdate ModuleTag_AiPowers2HealAI
            CommandButtonName = AiPowers2HealButton
            SpecialPowerAIType = AI_SPECIAL_POWER_SELFAOEHEALHEROS
            SpecialPowerRadius = 50
        End
    End
End
