Object TreeIronHillsDead01
    IsHarvestable = No
End

Object TreeCoverRemovedProbe
    KindOf = INFANTRY IMMOBILE NO_COLLIDE
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody TreeCoverBody
            MaxHealth = 100
        End
        Behavior = InvisibilityUpdate TreeCoverCamouflage
            StartsActive = Yes
            UpdatePeriod = 100
            InvisibilityNugget
                InvisibilityType = CAMOUFLAGE
                ForbiddenConditions = AWAY_FROM_TREES
            End
        End
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 4
    GeometryHeight = 10
    GeometryIsSmall = Yes
End

ChildObject TreeCoverStandingProbe TreeCoverRemovedProbe
End

ChildObject TreeCoverPorter MenPorter
    CommandSet = TreeCoverPorterCommands
    RemoveModule ModueTag_MountedCommandSet
    RemoveModule ModueTag_DismountCommandSet
    RemoveModule ModueTag_MenPorterCommandSetForEasyNormalAI
    RemoveModule ModueTag_MenPorterCommandSetForHardBrutalAI
    RemoveModule ModueTag_MenPorterCommandSetAI_WotR
End

ChildObject TreeCoverFarm GondorFarm
    BuildCost = 0
    BuildTime = 1
    GeometryMajorRadius = 16
    GeometryMinorRadius = 16
    RemoveModule ModuleTag_NewMoney
End

CommandButton TreeCoverBuildFarm
    Command = DOZER_CONSTRUCT
    Object = TreeCoverFarm
End

CommandSet TreeCoverPorterCommands
    1 = TreeCoverBuildFarm
End
