Object SkirmishWaypointWalker
    KindOf = INFANTRY IGNORE_FOR_VICTORY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody ModuleTag_SkirmishWaypointBody
            MaxHealth = 10
            InitialHealth = 10
        End
        Behavior = AIUpdateInterface ModuleTag_SkirmishWaypointAI
        End
    End
    LocomotorSet
        Locomotor = HumanLocomotor
        Condition = SET_NORMAL
        Speed = 20
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 3
    GeometryHeight = 6
End

Object SkirmishWaypointStatic
    KindOf = IMMOBILE IGNORE_FOR_VICTORY
    Geometry = CYLINDER
    GeometryMajorRadius = 3
    GeometryHeight = 6
End
