ChildObject Slot8TunnelControl MineShaft_Interface
	CommandPointBonus = 0
	VisionRange = 0
	ShroudClearingRange = 0
	RemoveModule ModuleTag_EreborMineshaftSpeedBuff
	RemoveModule FireDeadTag1
End

ChildObject Slot8TunnelTimed Slot8TunnelControl
	ReplaceModule ModuleTag_Draw
		Draw = W3DScriptedModelDraw ModuleTag_Slot8MineDraw
			ExtraPublicBone = OBJECT01
			DefaultModelConditionState
				Model = dbNmine_skn
			End
		End
	End
	ReplaceModule ModuleTag_Contain
		Behavior = TunnelContain ModuleTag_Slot8Tunnel
			ObjectStatusOfContained = UNSELECTABLE
			ContainMax = 5
			DamagePercentToUnits = 0%
			PassengerFilter = ANY +INFANTRY +BANNER +CAVALRY AOTR_COMBO_HORDES_POS -MONSTER -SUMMONED -DwarvenBattleWagonNew -WildSnowTrollHorde
			AllowEnemiesInside = No
			AllowAlliesInside = No
			AllowNeutralInside = No
			AllowOwnPlayerInsideOverride = Yes
			NumberOfExitPaths = 1
			PassengerBonePrefix = PassengerBone:OBJECT KindOf:INFANTRY
			EntryPosition = X:50 Y:0 Z:0
			EntryOffset = X:150 Y:20 Z:0
			ExitOffset = X:150 Y:0 Z:0
			EnterSound = RuinedTowerEnterSound
			KillPassengersOnDeath = Yes
			ShowPips = Yes
			ExitDelay = 1000
		End
	End
End

