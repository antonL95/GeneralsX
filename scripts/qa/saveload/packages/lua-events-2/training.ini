Upgrade LuaEventsCastBreath
    Type = OBJECT
End

Object LuaEventsStationary
    KindOf = IMMOBILE IGNORE_FOR_VICTORY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody LuaEventsStationaryBody
            MaxHealth = 10000
            InitialHealth = 10000
        End
        Behavior = DestroyDie LuaEventsStationaryDie
        End
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 3
    GeometryHeight = 6
End

ChildObject LuaEventsChant LuaEventsStationary
    AddModule
        Behavior = AIUpdateInterface LuaEventsChantAI
            AILuaEventsList = MordorOrcFunctions
        End
    End
End

ChildObject LuaEventsEnt LuaEventsStationary
    AddModule
        Behavior = AIUpdateInterface LuaEventsEntAI
            AILuaEventsList = EntFunctions
        End
    End
End

ChildObject LuaEventsGate LuaEventsStationary
    AddModule
        Behavior = AIUpdateInterface LuaEventsGateAI
            AILuaEventsList = MinisTirithGateFunctions
        End
    End
End

ChildObject LuaEventsAura LuaEventsStationary
    AddModule
        Behavior = AIUpdateInterface LuaEventsAuraAI
            AILuaEventsList = DrummerTrollFunctions
        End
        Behavior = RadiateFearUpdate LuaEventsAuraPulse
            InitiallyActive = Yes
            GenerateFear = Yes
            EmotionPulseRadius = 75
            EmotionPulseInterval = 500
        End
    End
End

ChildObject LuaEventsBreath LuaEventsStationary
    AddModule
        Behavior = AIUpdateInterface LuaEventsBreathAI
            AILuaEventsList = BalrogFunctions
        End
        Behavior = ModelConditionUpgrade LuaEventsBreathUpgrade
            TriggeredBy = LuaEventsCastBreath
            AddConditionFlags = SPECIAL_POWER_2
        End
    End
End

Object LuaEventsMobile
    KindOf = INFANTRY SELECTABLE IGNORE_FOR_VICTORY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody LuaEventsMobileBody
            MaxHealth = 1000
            InitialHealth = 1000
        End
        Behavior = DestroyDie LuaEventsMobileDie
        End
        Behavior = PhysicsBehavior LuaEventsMobilePhysics
            Mass = 1
        End
    End
    LocomotorSet
        Locomotor = HumanLocomotor
        Condition = SET_NORMAL
        Speed = 45
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 3
    GeometryHeight = 6
End

ChildObject LuaEventsGrond LuaEventsMobile
    AddModule
        Behavior = AIUpdateInterface LuaEventsGrondAI
            AutoAcquireEnemiesWhenIdle = No
            AILuaEventsList = MordorGrondFunctions
        End
    End
End

ChildObject LuaEventsPanic LuaEventsMobile
    AddModule
        Behavior = AIUpdateInterface LuaEventsPanicAI
            AutoAcquireEnemiesWhenIdle = No
            AILuaEventsList = InfantryFunctions
        End
        Behavior = EmotionTrackerUpdate LuaEventsPanicTracker
            AddEmotion = Terror_Base
        End
    End
End

ChildObject LuaEventsCower LuaEventsMobile
    AddModule
        Behavior = AIUpdateInterface LuaEventsCowerAI
            AutoAcquireEnemiesWhenIdle = No
            AILuaEventsList = GondorFighterFunctions
        End
        Behavior = EmotionTrackerUpdate LuaEventsCowerTracker
            AddEmotion = FearIdle_Base
        End
    End
End
