ChildObject AiPowersCombatCaster AiPowersCombatTarget
    KindOf = INFANTRY HERO SELECTABLE CAN_ATTACK IGNORE_FOR_VICTORY
    VisionRange = 150
    ShroudClearingRange = 150
    WeaponSet
        Conditions = None
        Weapon = PRIMARY AiPowersBasicWeapon
    End
    AddModule
        Behavior = AIUpdateInterface ModuleTag_AiPowersCombatAI
            AutoAcquireEnemiesWhenIdle = No
        End
    End
End

ChildObject AiPowersChargeCaster AiPowersCombatCaster
    CommandSet = AiPowersChargeCommands
    AddModule
        Behavior = SpecialPowerModule ModuleTag_AiPowersChargePower
            SpecialPowerTemplate = AiPowersCharge
            UpdateModuleStartsAttack = Yes
            AvailableAtStart = Yes
        End
        Behavior = AISpecialPowerUpdate ModuleTag_AiPowersChargeAI
            CommandButtonName = AiPowersChargeButton
            SpecialPowerAIType = AI_SPECIAL_POWER_CHARGE
            SpecialPowerRange = 60
        End
        Behavior = WeaponFireSpecialAbilityUpdate ModuleTag_AiPowersChargeEffect
            SpecialPowerTemplate = AiPowersCharge
            StartAbilityRange = 90
            MustFinishAbility = Yes
            UnpackTime = 3000
            PreparationTime = 1
            PackTime = 200
            SpecialWeapon = AiPowersSpecialWeapon
        End
    End
End

ChildObject AiPowersMorgulCaster AiPowersCombatCaster
    CommandSet = AiPowersMorgulBladeCommands
    AddModule
        Behavior = SpecialPowerModule ModuleTag_AiPowersMorgulBladePower
            SpecialPowerTemplate = AiPowersMorgulBlade
            UpdateModuleStartsAttack = Yes
            AvailableAtStart = Yes
        End
        Behavior = AISpecialPowerUpdate ModuleTag_AiPowersMorgulBladeAI
            CommandButtonName = AiPowersMorgulBladeButton
            SpecialPowerAIType = AI_SPECIAL_POWER_MORGUL_BLADE
        End
        Behavior = WeaponFireSpecialAbilityUpdate ModuleTag_AiPowersMorgulBladeEffect
            SpecialPowerTemplate = AiPowersMorgulBlade
            StartAbilityRange = 90
            MustFinishAbility = Yes
            UnpackTime = 3000
            PreparationTime = 1
            PackTime = 200
            SpecialWeapon = AiPowersSpecialWeapon
        End
    End
End

SpecialPower AiPowersSummon
    Enum = SPECIAL_GENERAL_TARGETLESS_THREE
