CommandButton AiPowersSetBattle
    Command = SET_STANCE
    Stances = Battle
End

CommandButton AiPowersSetAggressive
    Command = SET_STANCE
    Stances = Aggressive
End

CommandButton AiPowersSetHoldGround
    Command = SET_STANCE
    Stances = HoldGround
End

CommandSet AiPowersStanceCommands
    1 = AiPowersSetBattle
    2 = AiPowersSetAggressive
    3 = AiPowersSetHoldGround
End

Object AiPowersStanceHero
    CommandSet = AiPowersStanceCommands
    KindOf = INFANTRY HERO SELECTABLE IMMOBILE IGNORE_FOR_VICTORY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody ModuleTag_AiPowersBody
            MaxHealth = 1000
        End
        Behavior = StancesBehavior ModuleTag_AiPowersStance
        End
        Behavior = AISpecialPowerUpdate ModuleTag_AiPowersStanceBattle
            CommandButtonName = AiPowersSetBattle
            SpecialPowerAIType = AI_SPECIAL_POWER_STANCEBATTLE
        End
        Behavior = AISpecialPowerUpdate ModuleTag_AiPowersStanceAggressive
            CommandButtonName = AiPowersSetAggressive
            SpecialPowerAIType = AI_SPECIAL_POWER_STANCEAGGRESSIVE
        End
        Behavior = AISpecialPowerUpdate ModuleTag_AiPowersStanceHoldGround
            CommandButtonName = AiPowersSetHoldGround
            SpecialPowerAIType = AI_SPECIAL_POWER_STANCEHOLDGROUND
        End
    End
End

ChildObject AiPowersStanceInjured AiPowersStanceHero
End

ChildObject AiPowersStanceHoldControl AiPowersStanceHero
    RemoveModule ModuleTag_AiPowersStanceBattle
    RemoveModule ModuleTag_AiPowersStanceAggressive
End
