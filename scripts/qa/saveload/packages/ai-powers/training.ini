        ObjectNames = AiPowersSummonMarker
        Count = 1
        Disposition = LIKE_EXISTING
    End
End

ChildObject AiPowersSummonCaster AiPowersCombatCaster
    CommandSet = AiPowersSummonCommands
    AddModule
        Behavior = OCLSpecialPower ModuleTag_AiPowersSummonPower
            SpecialPowerTemplate = AiPowersSummon
            AvailableAtStart = Yes
            CreateLocation = CREATE_AT_LOCATION
            OCL = AiPowersSummonList
        End
        Behavior = AISpecialPowerUpdate ModuleTag_AiPowersSummonAI
            CommandButtonName = AiPowersSummonButton
            SpecialPowerAIType = AI_SPECIAL_POWER_TARGETAOE_SUMMON
            SpecialPowerRange = 60
        End
    End
End

