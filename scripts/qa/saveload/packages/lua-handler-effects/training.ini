Object LuaHandlerActor
    KindOf = INFANTRY IMMOBILE IGNORE_FOR_VICTORY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody LuaHandlerBody
            MaxHealth = 10000
            InitialHealth = 10000
        End
        Behavior = AIUpdateInterface LuaHandlerAI
            AILuaEventsList = InfantryFunctions
            AutoAcquireEnemiesWhenIdle = No
        End
        Behavior = EmotionTrackerUpdate LuaHandlerTracker
            AddEmotion = UncontrollableFear_Base
            AddEmotion = FearIdle_Base
        End
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 3
    GeometryHeight = 6
End

ChildObject LuaHandlerPlotOne LuaHandlerActor
    KindOf = STRUCTURE IMMOBILE IGNORE_FOR_VICTORY
    RemoveModule LuaHandlerAI
    RemoveModule LuaHandlerTracker
    AddModule
        Behavior = FoundationAIUpdate LuaHandlerPlot
            BuildVariation = 1
        End
    End
End

ChildObject LuaHandlerPlotTwo LuaHandlerPlotOne
    ReplaceModule LuaHandlerPlot
        Behavior = FoundationAIUpdate LuaHandlerPlotSecond
            BuildVariation = 2
        End
    End
End
