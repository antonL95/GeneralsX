Upgrade LuaFixtureCondition
    Type = OBJECT
End

Upgrade LuaFixtureBlast
    Type = OBJECT
End

ChildObject LuaFixtureLevy DaleDalemenLevy
End

Object LuaFixtureConditionProbe
    KindOf = IMMOBILE
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody LuaFixtureConditionBody
            MaxHealth = 1000
            InitialHealth = 1000
        End
    End
    AddModule
        Behavior = AIUpdateInterface LuaFixtureConditionAI
            AILuaEventsList = GArcherRangeFunctions
        End
    End
    AddModule
        Behavior = ModelConditionUpgrade LuaFixtureConditionUpgrade
            TriggeredBy = LuaFixtureCondition
            AddConditionFlags = USER_2
        End
    End
End

Object LuaFixtureFortress
    KindOf = STRUCTURE IMMOBILE
    RemoveModule ModuleTag_DefaultInactiveBody
