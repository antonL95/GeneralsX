ModifierList DepositXpProduction
    Category = SPELL
    Modifier = PRODUCTION 75%
    Duration = 0
End

ChildObject DepositXpPlain MordorLumberMill
    IsTrainable = Yes
    RemoveModule ModuleTag_FreeWorker
    AddModule
        Behavior = AutoDepositUpdate ModuleTag_DepositXpPlain
            DepositTiming = 200
            DepositAmount = 10
        End
    End
End

ChildObject DepositXpNoXp MordorLumberMill
    IsTrainable = Yes
    RemoveModule ModuleTag_FreeWorker
    AddModule
        Behavior = AutoDepositUpdate ModuleTag_DepositXpNoXp
            DepositTiming = 200
            DepositAmount = 10
            GiveNoXP = Yes
        End
    End
End

ChildObject DepositXpGarrison DwarvenBattleWagon
    VisionRange = 0
    ShroudClearingRange = 0
    WeaponSet
        Conditions = None
    End
    ReplaceModule ModuleTag_12
        Behavior = TransportContain ModuleTag_DepositXpContain
            Slots = 2
            PassengerFilter = ANY +INFANTRY
            AllowOwnPlayerInsideOverride = Yes
            AllowAlliesInside = Yes
            AllowEnemiesInside = No
            AllowNeutralInside = No
            ExitDelay = 0
        End
    End
    AddModule
        Behavior = AutoDepositUpdate ModuleTag_DepositXpGarrison
            DepositTiming = 200
            DepositAmount = 10
            OnlyWhenGarrisoned = Yes
        End
    End
End

ChildObject DepositXpRider GondorFighter
    KindOf = SELECTABLE INFANTRY ALWAYS_VISIBLE
    VisionRange = 0
    ShroudClearingRange = 0
    WeaponSet
        Conditions = None
    End
End
