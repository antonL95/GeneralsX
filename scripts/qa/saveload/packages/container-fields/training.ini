Object Slot7Rider
    RemoveModule ModuleTag_DefaultInactiveBody
    KindOf = INFANTRY SELECTABLE CAN_RIDE_SIEGE_LADDER
    TransportSlotCount = 1
    AddModule
        Body = ActiveBody ModuleTag_Body
            MaxHealth = 100
            InitialHealth = 100
        End
    End
    AddModule
        Draw = W3DScriptedModelDraw ModuleTag_Draw
            DefaultModelConditionState
                Model = None
            End
        End
    End
    AddModule
        Behavior = AIUpdateInterface ModuleTag_AI
            AutoAcquireEnemiesWhenIdle = No
        End
    End
    LocomotorSet
        Locomotor = HumanLocomotor
        Condition = SET_NORMAL
        Speed = 40
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 3
    GeometryHeight = 8
    GeometryIsSmall = Yes
End

Object Slot7SeatFixed
    RemoveModule ModuleTag_DefaultInactiveBody
    KindOf = VEHICLE SELECTABLE
    AddModule
        Body = ActiveBody ModuleTag_Body
            MaxHealth = 200
            InitialHealth = 200
        End
    End
    AddModule
        Draw = W3DScriptedModelDraw ModuleTag_Draw
            ExtraPublicBone = PASSENGER01
            ExtraPublicBone = PASSENGER02
            DefaultModelConditionState
                Model = muNwain_skn
                Skeleton = hubtlwain_skl
            End
        End
    End
    AddModule
        Behavior = TransportContain ModuleTag_Contain
            Slots = 3
            PassengerFilter = NONE +Slot7Rider
            AllowOwnPlayerInsideOverride = Yes
            AllowAlliesInside = No
            AllowEnemiesInside = No
            AllowNeutralInside = No
            ObjectStatusOfContained = UNSELECTABLE
            PassengerBonePrefix = PassengerBone:PASSENGER KindOf:INFANTRY
            NumberOfExitPaths = 0
            ForceOrientationContainer = Yes
            ReleaseSnappyness = 0.05
        End
    End
    AddModule
        Behavior = FlammableUpdate ModuleTag_Burn
            BurnContained = Yes
            FlameDamageLimit = 1
            AflameDamageAmount = 20
            AflameDamageDelay = 10000
            AflameDuration = 1000
        End
    End
    AddModule
        Behavior = AIUpdateInterface ModuleTag_AI
            AutoAcquireEnemiesWhenIdle = No
        End
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 10
    GeometryHeight = 12
    GeometryIsSmall = Yes
End

ChildObject Slot7SeatFree Slot7SeatFixed
    ReplaceModule ModuleTag_Contain
        Behavior = TransportContain ModuleTag_ContainFree
            Slots = 3
            PassengerFilter = NONE +Slot7Rider
            AllowAlliesInside = Yes
            PassengerBonePrefix = PassengerBone:PASSENGER01 KindOf:INFANTRY
            NumberOfExitPaths = 0
            ForceOrientationContainer = No
        End
    End
End

Object Slot7Structure
    RemoveModule ModuleTag_DefaultInactiveBody
    KindOf = STRUCTURE SELECTABLE IMMOBILE
    TransportSlotCount = 0
    AddModule
        Body = ActiveBody ModuleTag_Body
            MaxHealth = 100
            InitialHealth = 100
        End
    End
    Geometry = BOX
    GeometryMajorRadius = 5
    GeometryMinorRadius = 5
    GeometryHeight = 6
    GeometryIsSmall = Yes
End

Object Slot7StructureGrab
    RemoveModule ModuleTag_DefaultInactiveBody
    KindOf = SELECTABLE
    AddModule
        Body = ActiveBody ModuleTag_Body
            MaxHealth = 100
            InitialHealth = 100
        End
    End
    AddModule
        Behavior = TransportContain ModuleTag_Contain
            Slots = 1
            PassengerFilter = NONE +STRUCTURE
            AllowAlliesInside = Yes
            CanGrabStructure = Yes
            KillPassengersOnDeath = Yes
            DamagePercentToUnits = 50%
            ObjectStatusOfContained = ENCLOSED
        End
    End
End

ChildObject Slot7StructureReject Slot7StructureGrab
    ReplaceModule ModuleTag_Contain
        Behavior = TransportContain ModuleTag_ContainReject
            Slots = 1
            PassengerFilter = NONE +STRUCTURE
            AllowAlliesInside = Yes
            CanGrabStructure = No
            ObjectStatusOfContained = ENCLOSED
        End
    End
End

Object Slot7Devourer
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody ModuleTag_Body
            MaxHealth = 100
            InitialHealth = 100
        End
    End
    AddModule
        Behavior = TransportContain ModuleTag_Contain
            Slots = 1
            PassengerFilter = NONE +RetreatBeacon
            AllowAlliesInside = Yes
            ShouldThrowOutPassengers = Yes
            ThrowOutPassengersDelay = 500
        End
    End
End

Weapon Slot7ContainerGrab
    AttackRange = 160
    GrabNugget
        ContainTargetOnEffect = Yes
    End
End
