ChildObject CastleWildlifeCamp MenFortress
    ReplaceModule ModuleTag_castle
        Behavior = CastleBehavior CastleWildlifeCampBehavior
            CastleToUnpackForFaction = Men Camp_MenNE
            PreBuiltList = CastleWildlifeOccupant 0
            ScanDistance = 0
        End
    End
End

Object CastleWildlifeOccupant
    KindOf = STRUCTURE IMMOBILE IGNORE_FOR_VICTORY
    BuildTime = 1
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody CastleWildlifeOccupantBody
            MaxHealth = 50
            InitialHealth = 50
        End
    End
End

ChildObject CastleWildlifeWalker GondorFighter
    ReplaceModule ModuleTag_03
        Behavior = AIUpdateInterface CastleWildlifeWalkerAI
            AutoAcquireEnemiesWhenIdle = No
        End
    End
End

ChildObject CastleWildlifeAnimal Sheep
    ReplaceModule ModuleTagWanderAround
        Behavior = AnimalAIUpdate CastleWildlifeAnimalAI
            FleeRange = 0
            FleeDistance = 0
            WanderPercentage = 0
            MaxWanderDistance = 0
            MaxWanderRadius = 500
            UpdateTimer = 10000
        End
    End
End
