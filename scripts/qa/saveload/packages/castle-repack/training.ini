ChildObject CastleRepackEmpty MenFortress
    ReplaceModule ModuleTag_castle
        Behavior = CastleBehavior CastleRepackEmptyBehavior
            CastleToUnpackForFaction = Men Camp_MenNE
            ScanDistance = 0
        End
    End
End

ChildObject CastleRepackCamp MenFortress
    ReplaceModule ModuleTag_castle
        Behavior = CastleBehavior CastleRepackCampBehavior
            CastleToUnpackForFaction = Men Camp_MenNE
            PreBuiltList = CastleRepackCampOccupant 0
            PreBuiltList = CastleRepackDefenseOccupant 0
            ScanDistance = 0
        End
    End
End

ChildObject CastleRepackFortress MenFortress
    ReplaceModule ModuleTag_castle
        Behavior = CastleBehavior CastleRepackFortressBehavior
            CastleToUnpackForFaction = Men fortress_erebor
            PreBuiltList = CastleRepackFortressOccupant 0
            ScanDistance = 0
        End
    End
End

Object CastleRepackCampOccupant
    KindOf = STRUCTURE IMMOBILE IGNORE_FOR_VICTORY
    BuildTime = 1
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody CastleRepackCampOccupantBody
            MaxHealth = 50
            InitialHealth = 50
        End
    End
End

ChildObject CastleRepackFortressOccupant CastleRepackCampOccupant
End

ChildObject CastleRepackDefenseOccupant CastleRepackCampOccupant
    KindOf = +FS_BASE_DEFENSE
End
