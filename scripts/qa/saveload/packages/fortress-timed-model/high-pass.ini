Upgrade Upgrade_FortressTimingFixture
    Type = OBJECT
End

Object FortressTimingFixture
    KindOf = IMMOBILE NO_COLLIDE NOT_AUTOACQUIRABLE UNATTACKABLE IGNORE_FOR_VICTORY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody ModuleTag_Body
            MaxHealth = 100
        End
        Draw = W3DScriptedModelDraw ModuleTag_Draw
            DefaultModelConditionState
                Model = GBFortress
            End
        End
        Behavior = ModelConditionUpgrade ModuleTag_FortressTimingFirst
            TriggeredBy = Upgrade_FortressTimingFixture
            AddTempConditionFlag = ModelConditionState:UPGRADE_IVORY_TOWER
            TempConditionTime = 9.0
        End
    End
    AddModule
        Behavior = ModelConditionUpgrade ModuleTag_FortressTimingSecond
            TriggeredBy = Upgrade_FortressTimingFixture
            AddTempConditionFlag = ModelConditionState:UPGRADE_NUMENOR_STONEWORK
            TempConditionTime = 6.0
        End
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 1
    GeometryHeight = 1
    GeometryIsSmall = Yes
End
