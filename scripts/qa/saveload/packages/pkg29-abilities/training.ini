	1 = Command_CreateAHero_WordOfPoultry_Level1
	2 = Command_CreateAHero_WordOfPoultry_Level2
End

ChildObject Pkg29Wizard CreateAHero
	CommandSet = Pkg29PoultryCommandSet
	ReplaceModule ModuleTag_WordOfPoultryUpdate_Level1
		Behavior = ReplaceObjectUpdate ModuleTag_Pkg29Poultry
			SpecialPowerTemplate = SpecialAbilityCreateAHeroWordOfPoultry_Level1
			UnpackingVariation = 1
			UnpackTime = 800
			PreparationTime = 1
			PackTime = 100
			StartAbilityRange = CREATE_A_HERO_WORD_OF_POULTRY_RANGE_L1
			MustFinishAbility = Yes
			ReplaceObject
				TargetObjectFilter = CREATE_A_HERO_WORD_OF_POULTRY_OBJECT_FILTER
				ReplacementObjectName = Chicken_Replacement
			End
			ReplaceRadius = CREATE_A_HERO_WORD_OF_POULTRY_RADIUS_L1
			ReplaceFX = FX_CreateAHeroReplaceObject
			Scatter = Yes
		End
	End
End

ChildObject Pkg29PoultryTarget Pkg29VolleyTarget
End

