ChildObject Pkg29VolleyLegolas RohanLegolas_Summoned
	ReplaceModule ModuleTag_ArrowWindStarter
		Behavior = SpecialPowerModule ModuleTag_Pkg29ArrowWindStarter
			SpecialPowerTemplate = SpecialAbilityArrowStorm
			UpdateModuleStartsAttack = Yes
			AvailableAtStart = Yes
			InitiateSound = LegolasVoiceModePiercingShots
		End
	End
End

ChildObject Pkg29VolleyAuto Pkg29VolleyLegolas
	ReplaceModule ModuleTag_LightningSwordAutoAbility
		Behavior = AutoAbilityBehavior ModuleTag_Pkg29VolleyAuto
			SpecialAbility = SpecialAbilityArrowStorm
			StartsActive = Yes
			MaxScanRange = 320
			Query = 1 NONE +Pkg29VolleyTarget ENEMIES
		End
	End
End

CommandButton Pkg29RainOfArrows
	Command = SPECIAL_POWER
	SpecialPower = SpecialAbilityCreateAHeroRainOfArrows_Level1
	Options = NEED_TARGET_POS CONTEXTMODE_COMMAND
	CursorName = Bombard
	InvalidCursorName = GenericInvalid
End

CommandSet Pkg29ArcherCommandSet
	1 = Pkg29RainOfArrows
End

ChildObject Pkg29Archer CreateAHero
	CommandSet = Pkg29ArcherCommandSet
End

Object Pkg29VolleyTarget
	KindOf = INFANTRY SELECTABLE
	RemoveModule ModuleTag_DefaultInactiveBody
	AddModule
		Body = ActiveBody ModuleTag_Body
			MaxHealth = 100000
		End
	End
	Geometry = CYLINDER
	GeometryMajorRadius = 4
	GeometryHeight = 10
	GeometryIsSmall = Yes
End
