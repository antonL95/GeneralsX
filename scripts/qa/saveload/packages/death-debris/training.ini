Object DeathDebrisSpawn
    KindOf = IMMOBILE NO_COLLIDE
End

Object DeathDebrisPiece
    KindOf = IMMOBILE NO_COLLIDE
End

ObjectCreationList DeathDebrisOCL
    CreateObject
        ObjectNames = DeathDebrisSpawn
        Count = 1
        Disposition = LIKE_EXISTING
    End
End

Object DeathDebrisVictim
    KindOf = IMMOBILE INFANTRY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody ModuleTag_Body
            MaxHealth = 1
        End
        Behavior = CreateObjectDie ModuleTag_Create
            DebrisPortionOfSelf = DeathDebrisPiece
            CreationList = DeathDebrisOCL
        End
        Behavior = DestroyDie ModuleTag_Destroy
        End
    End
End

Object DeathDebrisConverted
    KindOf = IMMOBILE NO_COLLIDE
End

ObjectCreationList DeathDebrisConversionOCL
    CreateObject
        ObjectNames = DeathDebrisConverted
        Count = 1
        Disposition = LIKE_EXISTING
    End
End

Object DeathDebrisConversionVictim
    KindOf = IMMOBILE INFANTRY
    ArmorSet
        Armor = NoArmor
    End
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody ModuleTag_Body
            MaxHealth = 1
        End
        Behavior = DamageFilteredCreateObjectDie ModuleTag_Convert
            CreationList = DeathDebrisConversionOCL
            DamageTypeTriggersInstantly = DeathDebrisSubtype
        End
        Behavior = DestroyDie ModuleTag_Destroy
        End
    End
End

Object DeathDebrisAttacker
    KindOf = IMMOBILE NO_COLLIDE
End

Weapon DeathDebrisInstantWeapon
    AttackRange = 1000
    DamageNugget
        Damage = 10
        DamageType = UNRESISTABLE
        DamageSubType = DeathDebrisSubtype
    End
End

Weapon DeathDebrisDelayedWeapon
    AttackRange = 1000
    DamageNugget
        Damage = 10
        DamageType = UNRESISTABLE
        DamageSubType = DeathDebrisSubtype
        DelayTime = 1000
    End
End

Object DeathDebrisSplashTarget
    KindOf = IMMOBILE INFANTRY
    ArmorSet
        Armor = NoArmor
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 2
    GeometryHeight = 8
    GeometryIsSmall = Yes
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody ModuleTag_Body
            MaxHealth = 100
        End
    End
End

Weapon DeathDebrisSplashWeapon
    AttackRange = 1000
    RadiusDamageAffects = ENEMIES
    DamageNugget
        Damage = 1
        Radius = 100
        DamageType = UNRESISTABLE
    End
End
