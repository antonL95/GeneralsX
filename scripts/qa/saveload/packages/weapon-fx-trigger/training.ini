Object WeaponFXTriggerLauncher
    KindOf = INERT NO_COLLIDE UNATTACKABLE
    VisionRange = 0
    ShroudClearingRange = 0
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody ModuleTag_Body
            MaxHealth = 100
        End
    End
End

Object WeaponFXTriggerBuilding
    KindOf = STRUCTURE SELECTABLE IMMOBILE NOT_AUTOACQUIRABLE
    VisionRange = 0
    ShroudClearingRange = 0
    ArmorSet
        Armor = NoArmor
    End
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody ModuleTag_Body
            MaxHealth = 10000
            DamageCreationList = OCL_BuildingDamageList01 CATAPULT_ROCK
        End
    End
    Geometry = BOX
    GeometryMajorRadius = 55
    GeometryMinorRadius = 55
    GeometryHeight = 40
    GeometryIsSmall = No
End

Object WeaponFXTriggerInfantry
    KindOf = INFANTRY SELECTABLE NOT_AUTOACQUIRABLE
    VisionRange = 0
    ShroudClearingRange = 0
    ArmorSet
        Armor = NoArmor
    End
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody ModuleTag_Body
            MaxHealth = 100
        End
    End
    AddModule
        Behavior = PhysicsBehavior ModuleTag_Physics
        End
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 5
    GeometryHeight = 10
    GeometryIsSmall = Yes
End

Weapon WeaponFXTriggerShock
    AttackRange = 250
    FXTrigger = CATAPULT_ROCK
    RadiusDamageAffects = ALLIES ENEMIES NEUTRALS
    MetaImpactNugget
        ShockWaveAmount = 30
        ShockWaveRadius = 45
        ShockWaveZMult = 1
        DelayTime = 1000
    End
End

Weapon WeaponFXTriggerReset
    AttackRange = 250
    DamageNugget
        Damage = 1
        DamageType = UNRESISTABLE
    End
End
