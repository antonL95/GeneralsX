ChildObject SpawnAngleMordorFoundation MordorFortress
    BuildTime = 1
End

ChildObject SpawnAngleMirkwoodFoundation MirkwoodFortress
    BuildTime = 1
End

CommandButton SpawnAngleBuildMordor
    Command = DOZER_CONSTRUCT
    Object = SpawnAngleMordorFoundation
End

CommandButton SpawnAngleBuildMirkwood
    Command = DOZER_CONSTRUCT
    Object = SpawnAngleMirkwoodFoundation
End

CommandSet SpawnAnglePorterCommands
    1 = SpawnAngleBuildMordor
    2 = SpawnAngleBuildMirkwood
End

ChildObject SpawnAnglePorter MenPorter
    CommandSet = SpawnAnglePorterCommands
    RemoveModule ModueTag_MountedCommandSet
    RemoveModule ModueTag_DismountCommandSet
    RemoveModule ModueTag_MenPorterCommandSetForEasyNormalAI
    RemoveModule ModueTag_MenPorterCommandSetForHardBrutalAI
    RemoveModule ModueTag_MenPorterCommandSetAI_WotR
End
