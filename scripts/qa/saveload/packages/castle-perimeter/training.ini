ChildObject CastlePerimeterPorter MenPorter
    CommandSet = CastlePerimeterPorterCommands
    RemoveModule ModueTag_MountedCommandSet
    RemoveModule ModueTag_DismountCommandSet
    RemoveModule ModueTag_MenPorterCommandSetForEasyNormalAI
    RemoveModule ModueTag_MenPorterCommandSetForHardBrutalAI
    RemoveModule ModueTag_MenPorterCommandSetAI_WotR
End

ChildObject CastlePerimeterWall MenWallSegmentSmall
    BuildCost = 100
    BuildTime = 10
End

CommandButton CastlePerimeterBuildWall
    Command = DOZER_CONSTRUCT
    Object = CastlePerimeterWall
End

CommandSet CastlePerimeterPorterCommands
    1 = CastlePerimeterBuildWall
End

ChildObject CastlePerimeterCamp MenFortress
    ReplaceModule ModuleTag_castle
        Behavior = CastleBehavior CastlePerimeterCampBehavior
            CastleToUnpackForFaction = Men Camp_MenNE
            ScanDistance = 0
            PreBuiltList = GondorBarracks 0
            PreBuiltList = GondorArcherRange -2
        End
    End
End

ChildObject CastlePerimeterSentry GondorFighter
End
