Upgrade SubObjectCreationFadeUpgrade
	Type = OBJECT
End

ChildObject SubObjectCreationFadeTrained GondorFighter
	BuildCost = 0
	BuildTime = 1
	CommandPoints = 0
	RemoveModule ForgedBlade_Upgrade
	AddModule
		Behavior = SubObjectsUpgrade ModuleTag_FadeFixture
			TriggeredBy = SubObjectCreationFadeUpgrade
			ShowSubObjects = Forged_Blade
			HideSubObjectsOnRemove = Yes
			FadeTimeInSeconds = 1.0
			WaitBeforeFadeInSeconds = 0.1
		End
	End
End

ChildObject SubObjectCreationFadeDirect SubObjectCreationFadeTrained
End

ChildObject SubObjectCreationFadeBoundary SubObjectCreationFadeTrained
End

ChildObject SubObjectCreationFadeYoung SubObjectCreationFadeTrained
End

ChildObject SubObjectCreationFadeSkip SubObjectCreationFadeTrained
	ReplaceModule ModuleTag_FadeFixture
		Behavior = SubObjectsUpgrade ModuleTag_FadeFixtureSkip
			TriggeredBy = SubObjectCreationFadeUpgrade
			ShowSubObjects = Forged_Blade
			FadeTimeInSeconds = 1.0
			WaitBeforeFadeInSeconds = 0.1
			SkipFadeOnCreate = Yes
		End
	End
End

CommandButton SubObjectCreationFadeTrain
	Command = UNIT_BUILD
	Object = SubObjectCreationFadeTrained
End

CommandSet SubObjectCreationFadeProducerCommands
	1 = SubObjectCreationFadeTrain
End

ChildObject SubObjectCreationFadeProducer GondorBarracks
	CommandSet = SubObjectCreationFadeProducerCommands
End
