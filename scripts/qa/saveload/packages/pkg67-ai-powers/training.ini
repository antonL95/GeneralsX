SpecialPower Pkg67BindingPower
	Enum = SPECIAL_GENERAL_TARGETLESS_THREE
	ReloadTime = 300000
End

CommandButton Pkg67BindingButton
	Command = SPECIAL_POWER
	SpecialPower = Pkg67BindingPower
End

CommandSet Pkg67ActiveCommands
	1 = Pkg67BindingButton
End

CommandSet Pkg67InactiveCommands
	1 = Command_Stop
End

Object Pkg67BindingCaster
	CommandSet = Pkg67ActiveCommands
	KindOf = SELECTABLE IMMOBILE IGNORE_FOR_VICTORY
	RemoveModule ModuleTag_DefaultInactiveBody
	AddModule
		Body = ActiveBody ModuleTag_Pkg67Body
			MaxHealth = 1000
		End
		Behavior = SpecialPowerModule ModuleTag_Pkg67Power
			SpecialPowerTemplate = Pkg67BindingPower
			AvailableAtStart = Yes
		End
		Behavior = AISpecialPowerUpdate ModuleTag_Pkg67BindingAI
			CommandButtonName = Pkg67BindingButton
			SpecialPowerAIType = AI_SPELLBOOK_ALWAYS_FIRE
		End
	End
End

ChildObject Pkg67UnresolvedCaster Pkg67BindingCaster
	RemoveModule ModuleTag_Pkg67BindingAI
	AddModule
		Behavior = AISpecialPowerUpdate ModuleTag_Pkg67UnresolvedAI
			CommandButtonName = Pkg67UndefinedButton
			SpecialPowerAIType = AI_SPELLBOOK_ALWAYS_FIRE
		End
	End
End

Weapon Pkg67TestWeapon
	AttackRange = 70
	DelayBetweenShots = 1000
	DamageNugget
		Damage = 1
		DamageType = SLASH
	End
End

ChildObject Pkg67PolicyCaster Pkg67BindingCaster
	CommandSet = Pkg67InactiveCommands
	KindOf = INFANTRY SELECTABLE CAN_ATTACK IGNORE_FOR_VICTORY
	VisionRange = 240
	ShroudClearingRange = 240
	WeaponSet
		Conditions = None
		Weapon = PRIMARY Pkg67TestWeapon
	End
	RemoveModule ModuleTag_Pkg67BindingAI
	RemoveModule ModuleTag_Pkg67Power
	AddModule
		Behavior = AIUpdateInterface ModuleTag_Pkg67UnitAI
			AutoAcquireEnemiesWhenIdle = No
		End
	End
End

ChildObject Pkg67InfantryTarget Pkg67BindingCaster
	CommandSet = Pkg67InactiveCommands
	KindOf = INFANTRY SELECTABLE IMMOBILE IGNORE_FOR_VICTORY
	RemoveModule ModuleTag_Pkg67BindingAI
	RemoveModule ModuleTag_Pkg67Power
End

ChildObject Pkg67HeroTarget Pkg67InfantryTarget
	KindOf = INFANTRY HERO SELECTABLE IMMOBILE IGNORE_FOR_VICTORY
End

ChildObject Pkg67MachineTarget Pkg67InfantryTarget
	KindOf = MACHINE SELECTABLE IMMOBILE IGNORE_FOR_VICTORY
End

