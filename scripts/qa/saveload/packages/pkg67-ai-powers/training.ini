	2 = Pkg67HotW4Button
End

ChildObject Pkg67HotWCaster Pkg67PolicyCaster
	CommandSet = Pkg67HotWCommands
	AddModule
		Behavior = SpecialPowerModule ModuleTag_Pkg67HotW3Power
			SpecialPowerTemplate = Pkg67HotW3Power
			AvailableAtStart = Yes
		End
		Behavior = AISpecialPowerUpdate ModuleTag_Pkg67HotW3AI
			CommandButtonName = Pkg67HotW3Button
			SpecialPowerAIType = AI_SPECIAL_POWER_ENEMY_TYPE_KILLER
		End
		Behavior = WeaponFireSpecialAbilityUpdate ModuleTag_Pkg67HotW3Effect
			SpecialPowerTemplate = Pkg67HotW3Power
			StartAbilityRange = 90
			SpecialWeapon = Pkg67TestWeapon
		End
		Behavior = SpecialPowerModule ModuleTag_Pkg67HotW4Power
			SpecialPowerTemplate = Pkg67HotW4Power
			AvailableAtStart = Yes
		End
		Behavior = AISpecialPowerUpdate ModuleTag_Pkg67HotW4AI
			CommandButtonName = Pkg67HotW4Button
			SpecialPowerAIType = AI_SPECIAL_POWER_ENEMY_TYPE_KILLER
			SpecialPowerRange = 90
		End
	End
End

