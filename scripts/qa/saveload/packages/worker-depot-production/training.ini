ChildObject WorkerDepotFixture MordorLumberMill
    IsTrainable = Yes
    ReplaceModule ModuleTag_FreeWorker
        Behavior = SpawnBehavior WorkerDepotFixtureSpawns
            SpawnNumber = 1
            SpawnTemplateName = WorkerDepotFixtureWorker
            OneShot = Yes
            RespectCommandLimit = No
        End
    End
End

ChildObject WorkerDepotFixtureWorker MordorWorker
    ReplaceModule ModuleTag_10
        Behavior = WorkerAIUpdate WorkerDepotFixtureHarvest
            MaxBoxes = 1
            HarvestTrees = Yes
            SupplyWarehouseScanDistance = 90
            SupplyCenterActionDelay = 1000
            HarvestActivationRange = 75
            HarvestPreparationTime = 150
            HarvestActionTime = 150
        End
    End
End

Object WorkerDepotFixtureTree
    KindOf = TREE
    IsHarvestable = Yes
    SupplyOverride = 1
End
