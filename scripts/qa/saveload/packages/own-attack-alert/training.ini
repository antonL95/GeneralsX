Armor OwnAttackAlertArmor
    Armor = DEFAULT 100%
    Armor = LOGICAL_FIRE 100%
    Armor = STATUS 100%
End


Weapon OwnAttackAlertFire
    AttackRange = 180
    DelayBetweenShots = 10000
    HitPercentage = 100
    FireLogicNugget
        LogicType = INCREASE_FUEL
        Radius = 24
        Damage = 70
        MinMaxBurnRate = 20
        MinDecay = 1
        MaxResistance = 5
    End
    FireLogicNugget
        LogicType = INCREASE_BURN_RATE
        Radius = 1
        Damage = 20
    End
End

Weapon OwnAttackAlertEnemyWeapon
    AttackRange = 120
    DelayBetweenShots = 10000
    DamageNugget
        Damage = 20
        DamageType = SLASH
    End
End

ChildObject OwnAttackAlertCaster GondorFighter
    WeaponSet
        Conditions = None
        Weapon = PRIMARY OwnAttackAlertFire
    End
End

ChildObject OwnAttackAlertEnemy GondorFighter
    WeaponSet
        Conditions = None
        Weapon = PRIMARY OwnAttackAlertEnemyWeapon
    End
End

ChildObject OwnAttackAlertVictim GondorFighter
    KindOf = SELECTABLE INFANTRY IMMOBILE
    ArmorSet
        Conditions = None
        Armor = OwnAttackAlertArmor
    End

    RemoveModule ModuleTag_03
    ReplaceModule ModuleTag_02
        Body = ActiveBody OwnAttackAlertBody
            MaxHealth = 5000
            InitialHealth = 5000
        End
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 2
    GeometryMinorRadius = 2
    GeometryHeight = 8
    GeometryIsSmall = Yes
End

Weapon OwnAttackAlertStatusWeapon
    AttackRange = 120
    DelayBetweenShots = 10000
    PrimaryDamage = 10000
    DamageType = STATUS
    DamageStatusType = WET
End

ChildObject OwnAttackAlertStatusEnemy GondorFighter
    WeaponSet
        Conditions = None
        Weapon = PRIMARY OwnAttackAlertStatusWeapon
    End
End

Weapon OwnAttackAlertFriendlyFire
    AttackRange = 180
    DelayBetweenShots = 10000
    RadiusDamageAffects = ALLIES
    DamageNugget
        Damage = 3
        Radius = 10
        DamageType = FLAME
    End
End

ChildObject OwnAttackAlertFriendlyCaster GondorFighter
    WeaponSet
        Conditions = None
        Weapon = PRIMARY OwnAttackAlertFriendlyFire
    End
End
