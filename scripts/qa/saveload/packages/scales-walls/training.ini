Locomotor ScalesWallsEnabled
    ScalesWalls = Yes
    Surfaces = GROUND RUBBLE OBSTACLE
    TurnTime = 1000
    Acceleration = 200
    Braking = 200
    Appearance = TWO_LEGS
    ZAxisBehavior = SCALING_WALLS
    StickToGround = Yes
End

Locomotor ScalesWallsDisabled
    ScalesWalls = No
    Surfaces = GROUND RUBBLE OBSTACLE
    TurnTime = 1000
    Acceleration = 200
    Braking = 200
    Appearance = TWO_LEGS
    ZAxisBehavior = SCALING_WALLS
    StickToGround = Yes
End

Object ScalesWallsUnit
    KindOf = INFANTRY SELECTABLE IGNORE_FOR_VICTORY
    VisionRange = 0
    ShroudClearingRange = 0
    Geometry = CYLINDER
    GeometryMajorRadius = 3
    GeometryHeight = 4
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody ScalesWallsBody
            MaxHealth = 100
        End
        Behavior = AIUpdateInterface ScalesWallsAI
            AutoAcquireEnemiesWhenIdle = No
        End
        Behavior = PhysicsBehavior ScalesWallsPhysics
            Mass = 1
        End
    End
    LocomotorSet
        Locomotor = ScalesWallsEnabled
        Condition = SET_NORMAL
        Speed = 60
    End
End

ChildObject ScalesWallsControl ScalesWallsUnit
    LocomotorSet
        Locomotor = ScalesWallsDisabled
        Condition = SET_NORMAL
        Speed = 60
    End
End
