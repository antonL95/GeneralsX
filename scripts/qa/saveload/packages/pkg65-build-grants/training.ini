Object Pkg65Anchor
    KindOf = IMMOBILE UNATTACKABLE NO_COLLIDE
    VisionRange = 0
    ShroudClearingRange = 0
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = HighlanderBody Pkg65AnchorBody
            MaxHealth = 50
        End
    End
End

ChildObject Pkg65OclGrant Pkg65Anchor
    Behavior = GrantUpgradeCreate ModuleTag_CompletionGrant
        UpgradeToGrant = Upgrade_MiniHordeLvl10
        GiveOnBuildComplete = Yes
    End
    Behavior = ModelConditionUpgrade ModuleTag_GrantApplied
        TriggeredBy = Upgrade_MiniHordeLvl10
        AddConditionFlags = RIDER5
    End
End

ObjectCreationList Pkg65OrdinaryOcl
    CreateObject
        ObjectNames = Pkg65OclGrant
        Count = 1
        Disposition = LIKE_EXISTING
    End
End
