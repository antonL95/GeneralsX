SpecialPower Pkg44CapturePower
	Enum = SPECIAL_SPELL_BOOK_UNTAMED_ALLEGIANCE
	ReloadTime = 300000
	RadiusCursorRadius = 60
	ObjectFilter = ANY +Pkg44Creep +Pkg44FarCreep ENEMIES NEUTRAL
	Flags = NEEDS_OBJECT_FILTER
End

CommandButton Pkg44CaptureButton
	Command = SPECIAL_POWER
	SpecialPower = Pkg44CapturePower
	Options = NEED_TARGET_POS
End

CommandSet Pkg44CasterCommands
	1 = Pkg44CaptureButton
End

Object Pkg44Caster
	CommandSet = Pkg44CasterCommands
	KindOf = SELECTABLE IMMOBILE
	VisionRange = 250
	ShroudClearingRange = 250
	RemoveModule ModuleTag_DefaultInactiveBody
	AddModule
		Body = ActiveBody ModuleTag_Pkg44CasterBody
			MaxHealth = 10000
		End
		Behavior = UntamedAllegianceSpecialPower ModuleTag_Pkg44Capture
			SpecialPowerTemplate = Pkg44CapturePower
			AttributeModifierAffects = ANY +Pkg44Creep +Pkg44FarCreep ENEMIES NEUTRAL
			AttributeModifierRange = 60
			AvailableAtStart = Yes
		End
		Behavior = AISpecialPowerUpdate ModuleTag_Pkg44CaptureAI
			CommandButtonName = Pkg44CaptureButton
			SpecialPowerAIType = AI_SPELLBOOK_CAPTURE_CREEP
			SpecialPowerRange = 100
		End
	End
End

Object Pkg44Creep
	KindOf = STRUCTURE CREEP SELECTABLE IMMOBILE IGNORE_FOR_VICTORY
	RemoveModule ModuleTag_DefaultInactiveBody
	AddModule
		Body = ActiveBody ModuleTag_Pkg44CreepBody
			MaxHealth = 10000
		End
	End
End

ChildObject Pkg44FarCreep Pkg44Creep
End

Upgrade Pkg44UnitArmor
	Type = OBJECT
	BuildTime = 1
	BuildCost = 0
End

Upgrade Pkg44NormalResearch
	Type = PLAYER
	BuildTime = 1
	BuildCost = 10
End

Upgrade Pkg44ImportantResearch
	Type = PLAYER
	BuildTime = 1
	BuildCost = 0
	SkirmishAIHeuristic = AI_UPGRADEHEURISTIC_IMPORTANT
End

CommandButton Pkg44BuyArmor
	Command = OBJECT_UPGRADE
	Upgrade = Pkg44UnitArmor
End

CommandButton Pkg44BuyNormal
	Command = PLAYER_UPGRADE
	Upgrade = Pkg44NormalResearch
End

CommandButton Pkg44BuyImportant
	Command = PLAYER_UPGRADE
	Upgrade = Pkg44ImportantResearch
End

CommandSet Pkg44UnitCommands
	1 = Pkg44BuyArmor
End

CommandSet Pkg44ResearchCommands
	1 = Pkg44BuyNormal
	2 = Pkg44BuyImportant
End

ChildObject Pkg44ArmoredUnit Pkg44Caster
	CommandSet = Pkg44UnitCommands
	KindOf = INFANTRY SELECTABLE IMMOBILE IGNORE_FOR_VICTORY
	RemoveModule ModuleTag_Pkg44Capture
	RemoveModule ModuleTag_Pkg44CaptureAI
	AddModule
		Behavior = ProductionUpdate ModuleTag_Pkg44UnitProduction
			MaxQueueEntries = 1
		End
		Behavior = StatusBitsUpgrade ModuleTag_Pkg44Armor
			TriggeredBy = Pkg44UnitArmor
		End
	End
End

ChildObject Pkg44ResearchHall Pkg44Caster
	CommandSet = Pkg44ResearchCommands
	KindOf = STRUCTURE SELECTABLE IMMOBILE IGNORE_FOR_VICTORY
	RemoveModule ModuleTag_Pkg44Capture
	RemoveModule ModuleTag_Pkg44CaptureAI
	AddModule
		Behavior = ProductionUpdate ModuleTag_Pkg44ResearchProduction
			MaxQueueEntries = 1
		End
	End
End
