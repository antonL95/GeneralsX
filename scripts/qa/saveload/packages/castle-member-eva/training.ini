AudioEvent CastleMemberEvaBuildLoop
    Sounds = CUBuild_consL2a CUBuild_consL2b
    Attack = CUBuild_consL1a
    Decay = CUBuild_consL3a
    Volume = 80
    Limit = 3
    Control = loop
    Priority = normal
    Type = ui everyone
End

NewEvaEvent CastleMemberEvaKeepAttack
    Priority = 300
    TimeBetweenEventsMS = 1000
    ExpirationTimeMS = 5000
    CountAsJumpToLocation = No
End

ChildObject CastleMemberEvaPacked MenFortress
    ReplaceModule ModuleTag_castle
        Behavior = CastleBehavior CastleMemberEvaPackedBehavior
            CastleToUnpackForFaction = Men fortress_erebor
            KeepDeathKillsEverything = Yes
            ScanDistance = 0
        End
    End
End

Object CastleMemberEvaWall
    KindOf = STRUCTURE IMMOBILE IGNORE_FOR_VICTORY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody CastleMemberEvaWallBody
            MaxHealth = 50
            InitialHealth = 50
        End
        Behavior = CastleMemberBehavior CastleMemberEvaWallCMB
            CountsForEvaCastleBreached = Yes
            BeingBuiltSound = CastleMemberEvaBuildLoop
        End
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 5
    GeometryHeight = 10
End

Object CastleMemberEvaTower
    KindOf = STRUCTURE IMMOBILE IGNORE_FOR_VICTORY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody CastleMemberEvaTowerBody
            MaxHealth = 50
            InitialHealth = 50
        End
        Behavior = CastleMemberBehavior CastleMemberEvaTowerCMB
            CountsForEvaCastleBreached = No
        End
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 5
    GeometryHeight = 10
End

Object CastleMemberEvaKeep
    KindOf = STRUCTURE IMMOBILE CASTLE_KEEP IGNORE_FOR_VICTORY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody CastleMemberEvaKeepBody
            MaxHealth = 50
            InitialHealth = 50
        End
        Behavior = CastleMemberBehavior CastleMemberEvaKeepCMB
            UnderAttackEvaEventIfKeep = CastleMemberEvaKeepAttack
        End
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 5
    GeometryHeight = 10
End

Object CastleMemberEvaAttacker
    KindOf = STRUCTURE IMMOBILE UNATTACKABLE IGNORE_FOR_VICTORY
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody CastleMemberEvaAttackerBody
            MaxHealth = 50
            InitialHealth = 50
        End
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 3
    GeometryHeight = 6
End
