			InitialPayload = AnaduneCaptain 4
			PassengerFilter = NONE +SIEGE_TOWER +INFANTRY
			ThisFormationIsTheMainFormation = Yes
			RankInfo = RankNumber:1 UnitType:SiegeHordeDeployLadder Position:X:0 Y:0
			RankInfo = RankNumber:2 UnitType:AnaduneCaptain Position:X:-24 Y:0 Position:X:-24 Y:-10 Position:X:-24 Y:10 Position:X:-34 Y:0
			SplitHorde = SplitResult:SiegeHordeDeployInfantry UnitType:AnaduneCaptain
		End
	End
End
