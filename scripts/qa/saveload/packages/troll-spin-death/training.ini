Weapon TrollSpinFixtureProbe
    AttackRange = 90
    DamageNugget
        Damage = 1
        DamageType = UNRESISTABLE
    End
End

Object TrollSpinFixtureUnit
    KindOf = IMMOBILE INFANTRY SELECTABLE CAN_ATTACK
    Geometry = CYLINDER
    GeometryMajorRadius = 2
    GeometryHeight = 8
    GeometryIsSmall = Yes
    WeaponSet
        Conditions = None
        Weapon = PRIMARY TrollSpinFixtureProbe
    End
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = ActiveBody ModuleTag_TestBody
            MaxHealth = 2000
        End
    End
End

Object TrollSpinFixtureBuilding
    KindOf = STRUCTURE IMMOBILE SELECTABLE
    Geometry = CYLINDER
    GeometryMajorRadius = 2
    GeometryHeight = 8
    GeometryIsSmall = Yes
    RemoveModule ModuleTag_DefaultInactiveBody
    AddModule
        Body = StructureBody ModuleTag_TestBody
            MaxHealth = 2000
        End
    End
End

ChildObject TrollSpinFixtureVulnerable GoblinCaveTroll
    ReplaceModule ModuleTag_02
        Body = DelayedDeathBody ModuleTag_VulnerableBody
            MaxHealth = 2500
            MaxHealthDamaged = 250
            MaxHealthReallyDamaged = 100
            DelayedDeathTime = 5000
            DoHealthCheck = No
            CanRespawn = No
            ImmortalUntilDeathTime = No
        End
    End
End
