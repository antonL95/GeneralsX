Object OclIntensitySource
    KindOf = IMMOBILE NO_COLLIDE INERT
End

Object OclIntensityChunk
    KindOf = NO_COLLIDE INERT
    AddModule
        Behavior = PhysicsBehavior ModuleTag_OclIntensityFlight
            Mass = 2.0
            ForwardFriction = 0.0
            LateralFriction = 0.0
            ZFriction = 0.0
            AerodynamicFriction = 0.0
        End
    End
End

ChildObject OclIntensityOut OclIntensityChunk
End

ChildObject OclIntensityUp OclIntensityChunk
End

ChildObject OclIntensityFlying OclIntensityChunk
End

ObjectCreationList OclIntensityChunkList
    CreateObject
        ObjectNames = OclIntensityChunk
        Disposition = BUILDING_CHUNKS LIKE_EXISTING
        DispositionIntensity = 6
        VelocityScale = 2
        Offset = X:10 Y:0 Z:8
    End
End

ObjectCreationList OclIntensityOutList
    CreateObject
        ObjectNames = OclIntensityOut
        Disposition = SEND_IT_OUT
        DispositionIntensity = 30
    End
End

ObjectCreationList OclIntensityUpList
    CreateObject
        ObjectNames = OclIntensityUp
        Disposition = SEND_IT_UP
        DispositionIntensity = 30
    End
End

ObjectCreationList OclIntensityFlyingList
    CreateObject
        ObjectNames = OclIntensityFlying
        Disposition = SEND_IT_FLYING
        DispositionIntensity = 30
        VelocityScale = 2
    End
End
