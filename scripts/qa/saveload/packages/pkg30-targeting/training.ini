CommandButton Pkg30CommandHealTarget
	Command = SPECIAL_POWER
	SpecialPower = SpecialAbilityCreateAHeroAthelas
	Options = NEED_TARGET_ALLY_OBJECT
	CursorName = Bombard
	InvalidCursorName = GenericInvalid
	TextLabel = CONTROLBAR:Athelas
	ButtonImage = HSAragornAthelas
	ButtonBorderType = ACTION
	InPalantir = Yes
	NeedDamagedTarget = Yes
End

CommandSet Pkg30HealerCommandSet
	1 = Pkg30CommandHealTarget
	2 = Command_CreateAHero_SpecialAbilityAthelas
	14 = Command_Stop
End

ChildObject Pkg30Healer GondorAragorn
	CommandSet = Pkg30HealerCommandSet
	AddModule
		Behavior = PlayerHealSpecialPower ModuleTag_Pkg30HealTarget
			SpecialPowerTemplate = SpecialAbilityCreateAHeroAthelas
			HealAffects = HERO INFANTRY
			HealAmount = 50.0
			HealRadius = 150.0
			AffectAllies = Yes
			StartsPaused = No
		End
	End
End

