Object ToggleHiddenTarget
	KindOf = INFANTRY SELECTABLE NO_COLLIDE IGNORE_FOR_VICTORY
	VisionRange = 0
	ShroudClearingRange = 0
	Geometry = CYLINDER
	GeometryMajorRadius = 6
	GeometryHeight = 16
	RemoveModule ModuleTag_DefaultInactiveBody
	AddModule
		Body = ActiveBody ToggleHiddenTargetBody
			MaxHealth = 50000
			InitialHealth = 50000
		End
		Behavior = AIUpdateInterface ToggleHiddenTargetAI
			AutoAcquireEnemiesWhenIdle = No
		End
	End
End
