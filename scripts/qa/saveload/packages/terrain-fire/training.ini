Weapon TerrainFireFixtureIgnition
    AttackRange = 180
    DelayBetweenShots = 10000
    HitPercentage = 100
    FireLogicNugget
        LogicType = INCREASE_FUEL
        Radius = 24
        Damage = 70
        MinMaxBurnRate = 20
        MinDecay = 1
        MaxResistance = 5
    End
    FireLogicNugget
        LogicType = INCREASE_BURN_RATE
        Radius = 1
        Damage = 20
    End
End

ChildObject TerrainFireFixtureLauncher GondorFighter
    RemoveModule ModuleTag_03
    AddModule
        Behavior = FireWeaponUpdate ModuleTag_TerrainFireFixture
            FireWeaponNugget
                WeaponName = TerrainFireFixtureIgnition
                FireDelay = 0
                OneShot = Yes
                Offset = X:90 Y:0 Z:0
            End
        End
    End
End

Armor TerrainFireFixtureArmor
    Armor = DEFAULT 0%
    Armor = LOGICAL_FIRE 100%
End

ChildObject TerrainFireFixtureObserver GondorFighter
    KindOf = SELECTABLE INFANTRY IMMOBILE
    RemoveModule ModuleTag_03
    ReplaceModule ModuleTag_02
        Body = ActiveBody TerrainFireObserverBody
            MaxHealth = 2000
            InitialHealth = 2000
        End
    End
    Geometry = CYLINDER
    GeometryMajorRadius = 2
    GeometryMinorRadius = 2
    GeometryHeight = 8
    GeometryIsSmall = Yes
    ArmorSet
        Conditions = None
        Armor = TerrainFireFixtureArmor
    End
End

Weapon TerrainFireFixtureDirectional
    FireLogicNugget
        LogicType = INCREASE_FUEL
        Radius = 16
        Damage = 70
        MinMaxBurnRate = 20
        MinDecay = 1
        MaxResistance = 5
    End
    FireLogicNugget
        LogicType = INCREASE_BURN_RATE
        Radius = 16
        Damage = 20
        DamageArc = 60
    End
End

ChildObject TerrainFireFixtureDirectionalLauncher TerrainFireFixtureLauncher
    ReplaceModule ModuleTag_TerrainFireFixture
        Behavior = FireWeaponUpdate TerrainFireFixtureDirectionalUpdate
            FireWeaponNugget
                WeaponName = TerrainFireFixtureDirectional
                FireDelay = 0
                OneShot = Yes
                Offset = X:90 Y:0 Z:0
            End
        End
    End
End
