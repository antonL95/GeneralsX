        Behavior = DozerAIUpdate Pkg08Dozer
            RepairHealthPercentPerSecond = 1%
            BoredTime = 5000
            BoredRange = 150
            AutoAcquireEnemiesWhenIdle = No
        End
    End
End

Weapon Pkg19SaveWindup
    AttackRange = 150
    PreAttackDelay = 900
    PreAttackType = PER_SHOT
    LockWhenUsing = Yes
    DamageNugget
        Damage = 20
        DamageType = PIERCE
    End
End

Weapon Pkg19SaveSecondary
    AttackRange = 150
    DelayBetweenShots = 2400
