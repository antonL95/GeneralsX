Object GondorFaramir
	AddModule
		Behavior = ExperienceLevelCreate ModuleTag_TestStartingRank
			LevelToGrant = 2
		End
		Behavior = ShareExperienceBehavior ModuleTag_TestHordeExperience
			ObjectFilter = NONE +GondorFighter
			Radius = 350.0
			DropOff = 0
		End
	End
	ReplaceModule ModuleTag_RespawnUpdate
		Behavior = RespawnUpdate ModuleTag_TestRespawn
			RespawnRules = AutoSpawn:No Cost:100 Time:1000 Health:100%
			RespawnEntry = Level:3 Cost:200 Time:1000
		End
	End
End
